<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Flick Links">
<meta property="og:description" content="Three holes a day on the front nine. Same holes for everyone. Fewest strokes wins the group chat.">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flick Links</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Marcellus+SC&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap">
<style>
/* Layout: a full-bleed aerial of the hole on one canvas. Brass-ruled green plaques sit on the screen edges,
   and every menu is a sheet of clubhouse card stock that rises from the bottom, where the thumb already is. */
:root{
  --club:#14493a; --club-deep:#0b2a21; --club-hi:#1f6450; --cream:#f4ecd6; --paper:#f8f2e0; --paper-2:#efe6cb;
  --ink:#1c2620; --ink-2:#56604f; --gold:#b9933b; --gold-hi:#e6cf8a; --claret:#7b1e2b; --claret-deep:#561420;
  --pencil:#33373a; --rule:#2b5a48; --tee-gold:#ead9a0; --white:#ffffff;
  --display:'Playfair Display','Hoefler Text','Baskerville','Georgia',serif;
  --caps:'Copperplate','Copperplate Gothic Light','Marcellus SC','Georgia',serif;
  --hand:'Kalam','Bradley Hand','Comic Sans MS',cursive;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--club-deep)}
body{height:100%;background:var(--club-deep);color:var(--ink);font-family:var(--display);font-size:14px;overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;cursor:crosshair}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud.top{top:10px;align-items:flex-start}
.hud.bottom{bottom:8px;align-items:flex-end}
.plate{pointer-events:none;color:var(--cream);background:linear-gradient(180deg,var(--club-hi),var(--club) 45%,var(--club-deep));
  border:1px solid var(--gold);border-radius:9px;box-shadow:inset 0 0 0 2px rgba(11,42,33,.55),inset 0 1px 0 3px rgba(230,207,138,.12),0 4px 10px rgba(0,0,0,.4)}
button.plate,.plate button{pointer-events:auto}
.lbl{font:400 11px/1 var(--caps);letter-spacing:.11em;text-transform:uppercase;color:var(--gold-hi)}
.num{font:800 30px/0.9 var(--display);font-variant-numeric:lining-nums tabular-nums}

.holeinfo{display:flex;flex-direction:column;gap:4px;padding:8px 12px 8px;max-width:58vw}
.holeinfo b{font:italic 700 17px/1.05 var(--display)}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pin{display:flex;align-items:baseline;gap:6px;padding:8px 13px 9px}
.wind{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 7px}
.wind .num{font-size:20px}
.wind svg{width:24px;height:24px;display:block}
.wind svg path{fill:var(--gold-hi)}

.club{display:flex;align-items:center;gap:2px;padding:3px}
.club button{width:38px;height:40px;border-radius:7px;font:800 24px/1 var(--display);color:var(--gold-hi)}
.club button:active{background:rgba(230,207,138,.18)}
.club button:disabled{opacity:.3}
.club button:disabled{visibility:hidden}
.clubtxt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:118px;padding:0 4px}
.clubtxt b{font:800 17px/1 var(--display)}
.round{width:34px;height:34px;border-radius:50%;font:800 15px/1 var(--display);display:grid;place-items:center}
.go{min-width:104px;height:48px;padding:2px 18px 0;font:400 15px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,#93283a,var(--claret) 55%,var(--claret-deep))}
.go:active{transform:translateY(2px)}
.round[aria-pressed="false"]{color:rgba(244,236,214,.45);text-decoration:line-through}
.tools{display:flex;gap:6px}

#hint,#toast{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;transition:opacity .25s}
#hint{bottom:70px;white-space:nowrap;font:italic 700 16px/1.2 var(--display);color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.55)}
#toast{top:128px;width:max-content;max-width:calc(100% - 32px);background:var(--paper);color:var(--ink);padding:10px 18px 9px;border-radius:4px;
  font:italic 700 17px/1.2 var(--display);opacity:0;box-shadow:inset 0 0 0 1px var(--gold),0 6px 16px rgba(0,0,0,.4)}
#toast.on{opacity:1}
#toast small{display:block;margin-top:5px;font:400 11px/1 var(--caps);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}

#scrim{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,22,17,.42)}
#card{width:min(100%,480px);max-height:92%;overflow-y:auto;box-sizing:border-box;color:var(--ink);
  background:repeating-linear-gradient(93deg,rgba(120,100,50,.035) 0 1px,transparent 1px 4px),linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:10px 10px 0 0;border-top:1px solid var(--gold);
  padding-block:20px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.45);animation:rise .34s cubic-bezier(.2,.9,.3,1.05)}
@keyframes rise{from{transform:translateY(46px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#card{animation:none}#hint,#toast{transition:none}}

.mast{display:flex;align-items:center;gap:12px}
.mast svg{width:54px;height:62px;flex:none}
.mast h1{margin:0;font:italic 700 40px/0.95 var(--display);letter-spacing:-.01em;color:var(--club)}
.mast p{margin:5px 0 0;font:400 11.5px/1.25 var(--caps);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.stamp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stamp span:last-child{color:var(--claret)}
.eyebrow{margin:0;font:400 11.5px/1.3 var(--caps);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
h2{margin:0;font:italic 700 31px/1.02 var(--display);color:var(--club);text-wrap:balance}
p{margin:0;line-height:1.45}
.sub{font:600 15px/1.4 var(--display);color:var(--ink)}
.fine{font:600 12.5px/1.45 var(--display);color:var(--ink-2)}
.fine b{color:var(--ink);font-variant-numeric:tabular-nums}
.flourish{height:9px;background:linear-gradient(var(--gold),var(--gold)) center/100% 1px no-repeat;position:relative}
.flourish::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px var(--paper)}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.how figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.how svg{width:100%;height:auto;border-radius:4px;display:block;background:linear-gradient(160deg,#6aa84a,#4c8a3a);box-shadow:inset 0 0 0 1px var(--club)}
.how figcaption{font:600 12.5px/1.3 var(--display)}

.btn{min-height:52px;border-radius:6px;padding:2px 18px 0;font:400 15px/1.1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--cream);
  background:linear-gradient(180deg,#93283a,var(--claret));border:1px solid var(--gold);box-shadow:inset 0 0 0 2px rgba(86,20,32,.6),0 3px 0 var(--claret-deep)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(86,20,32,.6),0 1px 0 var(--claret-deep)}
.btn.green{background:linear-gradient(180deg,var(--club-hi),var(--club));box-shadow:inset 0 0 0 2px rgba(11,42,33,.6),0 3px 0 var(--club-deep)}
.btn.ghost{background:transparent;color:var(--club);border:1px solid var(--club);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px rgba(20,73,58,.35)}
.btn.ghost:active{transform:none;background:rgba(20,73,58,.08)}
.btn small{display:block;margin-top:4px;font:italic 600 12px/1 var(--display);letter-spacing:0;text-transform:none;opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 150px}

/* the scorecard: printed stock, pencil marks */
.card-sc{border:1.5px solid var(--rule);background:var(--paper);box-shadow:0 2px 0 rgba(43,90,72,.18)}
.sc-head{display:flex;align-items:center;gap:9px;background:var(--club);color:var(--cream);padding:7px 10px}
.sc-head svg{width:22px;height:25px;flex:none}
.sc-head b{font:400 13px/1.15 var(--caps);letter-spacing:.14em;text-transform:uppercase}
.sc-head span{margin-left:auto;font:italic 600 12.5px/1 var(--display);color:var(--gold-hi);white-space:nowrap}
table.sc{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:lining-nums tabular-nums}
.sc th,.sc td{border:1px solid var(--rule);padding:5px 0 4px;text-align:center;font:600 13px/1 var(--display);overflow:hidden}
.sc th{width:48px;font:400 9.5px/1 var(--caps);letter-spacing:.09em;text-transform:uppercase;color:var(--rule);text-align:left;padding-left:6px}
.sc.wide th{width:74px}
.sc tr.h td,.sc tr.h th{background:var(--club);color:var(--cream);border-color:var(--club-hi);font:400 12px/1 var(--caps);padding-block:6px 5px}
.sc tr.g td,.sc tr.g th{background:var(--tee-gold)}
.sc tr.p td{font-weight:800;font-size:14px}
.sc tr.k td{font:italic 600 11.5px/1 var(--display);color:var(--ink-2)}
.sc tr.s td{height:38px;padding:0;font:700 23px/1 var(--hand);color:var(--pencil)}
.sc tr.s th{color:var(--ink)}
.sc td.out{border-left:3px double var(--rule);width:44px;font-weight:800}
.sc.wide td.out{width:74px}
.mk{display:inline-grid;place-items:center;width:27px;height:27px;padding-top:3px;box-sizing:border-box}
.mk.birdie,.mk.eagle{border:1.6px solid var(--pencil);border-radius:52% 48% 50% 50%/48% 52% 47% 53%;transform:rotate(-4deg)}
.mk.eagle{box-shadow:0 0 0 2px var(--paper),0 0 0 3.4px var(--pencil)}
.mk.bogey,.mk.dbl{border:1.6px solid var(--pencil);border-radius:2px 4px 3px 5px;transform:rotate(2deg)}
.mk.dbl{box-shadow:0 0 0 2px var(--paper),0 0 0 3.4px var(--pencil)}
.sc-foot{display:flex;gap:14px;padding:8px 10px 7px;font:400 9.5px/1 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--rule)}
.sc-foot span{flex:1;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--rule);padding-bottom:2px;min-width:0}
.sc-foot i{font:400 17px/0.8 var(--hand);color:var(--pencil);letter-spacing:0;text-transform:none;white-space:nowrap}

#shareText{width:100%;box-sizing:border-box;resize:none;border:1px dashed var(--rule);border-radius:3px;background:rgba(255,255,255,.55);
  color:var(--ink);padding:9px 11px;font:600 15px/1.4 var(--display);-webkit-user-select:text;user-select:text}
</style>

<div id="app">
  <canvas id="c" aria-label="Aerial view of the golf hole. Pull back to aim, then flick forward to swing."></canvas>

  <div class="hud top">
    <div class="plate holeinfo">
      <span class="lbl" id="hHole">No. 1 · Par 4 · 423 yd</span>
      <b id="hName">First Tee</b>
      <span class="lbl" id="hStroke">Shot 1</span>
    </div>
    <div class="stack">
      <div class="plate pin"><span class="num" id="hDist">356</span><span class="lbl" id="hUnit">yd to pin</span></div>
      <div class="plate wind" title="Wind">
        <svg id="windArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l6 9h-4v11h-4V11H6z"/></svg>
        <span class="num" id="hWind">0</span><span class="lbl">mph</span>
      </div>
      <div class="tools">
        <button class="plate round" id="btnSound" aria-label="Sound" aria-pressed="true">♪</button>
        <button class="plate round" id="btnHelp" aria-label="How to play">?</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hint">Pull back to aim, flick up as the ring fills</div>

  <div class="hud bottom">
    <div class="plate club">
      <button id="clubPrev" aria-label="Shorter club">‹</button>
      <div class="clubtxt"><b id="clubName">Driver</b><span class="lbl" id="clubMax">240 yd · Tee</span></div>
      <button id="clubNext" aria-label="Longer club">›</button>
    </div>
    <button class="plate go" id="btnPutt" hidden>Putt</button>
  </div>

  <div id="scrim" hidden><div id="card" role="dialog" aria-modal="true" aria-label="Flick Links"></div></div>
</div>

<script>
(()=>{'use strict';
// ───────── basics
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1;
const TAU=Math.PI*2,DEG=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const sum=a=>a.reduce((x,y)=>x+y,0);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rotv(x,y,a){const c=Math.cos(a),s=Math.sin(a);return{x:x*c-y*s,y:x*s+y*c}}
function angTo(a,b,t){const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t}

// ───────── scene palette (a Hill Country summer: bermuda, white sand, limestone, tea-coloured water)
const K={floor:'#33512b',rough:'#4b7735',cut:'#5a8d3d',fair:'#69a547',fringe:'#70b04d',green:'#7bc05a',tee:'#72ad4c',
  sand:'#f0e7cd',sandSh:'#8c7a52',water:'#1d6470',deep:'#103d49',shallow:'#63b3a6',bank:'#34351f',path:'#d8ceb4',
  stone:'#cfcabb',wood:'#8a6a43',cream:'#f4ecd6',gold:'#e6cf8a',claret:'#9c2a3c',ink:'#0b2a21'};
const SUN={x:.62,y:.78}; // shadows fall this way in the world; the sun sits to the north-west

// ───────── textures and sprites, drawn once
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
function softDot(g,x,y,r,rgb,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
function wrapDot(g,w,h,x,y,r,rgb,a){for(const ox of[-w,0,w])for(const oy of[-h,0,h])if(x+ox+r>0&&x+ox-r<w&&y+oy+r>0&&y+oy-r<h)softDot(g,x+ox,y+oy,r,rgb,a)}
const TEX=(()=>{const r=mulberry32(4242),T={};
  T.mottle=tex(256,256,(g,w,h)=>{for(let i=0;i<110;i++)wrapDot(g,w,h,r()*w,r()*h,14+r()*40,r()<.52?'10,30,0':'235,240,150',.07+r()*.09)});
  T.far=tex(128,128,(g,w,h)=>{for(let i=0;i<300;i++)wrapDot(g,w,h,r()*w,r()*h,2+r()*4.5,r()<.55?'0,25,0':'240,250,170',.1+r()*.14)});
  T.grain=tex(128,128,(g,w,h)=>{for(let i=0;i<1500;i++){g.fillStyle=r()<.55?`rgba(0,30,0,${.1+r()*.2})`:`rgba(235,255,170,${.08+r()*.16})`;const s=.8+r()*1.6;g.fillRect(r()*w,r()*h,s,s*(1+r()*1.6))}});
  T.stripe=tex(8,1,g=>{g.fillStyle='#fff';g.fillRect(0,0,4,1);g.fillStyle='#000';g.fillRect(4,0,4,1)});
  T.rake=tex(64,64,(g,w,h)=>{g.lineWidth=1;for(let y=-8;y<h+8;y+=5){g.strokeStyle=`rgba(120,100,60,${.25+r()*.2})`;g.beginPath();for(let x=0;x<=w;x+=4)g.lineTo(x,y+Math.sin(x/w*TAU*2+y)*2.2);g.stroke()}});
  T.glint=tex(128,128,(g,w,h)=>{g.lineCap='round';for(let i=0;i<70;i++){const x=r()*w,y=r()*h,l=3+r()*9;g.strokeStyle=`rgba(225,250,245,${.12+r()*.35})`;g.lineWidth=.8+r()*1.3;
    for(const ox of[-w,0,w]){g.beginPath();g.moveTo(x+ox,y);g.quadraticCurveTo(x+ox+l/2,y-1.6,x+ox+l,y);g.stroke()}}});
  T.cloud=tex(256,256,(g,w,h)=>{for(let i=0;i<9;i++)wrapDot(g,w,h,r()*w,r()*h,46+r()*56,'20,34,60',.3+r()*.22)});
  T.bloom=tex(64,64,(g,w,h)=>{for(let i=0;i<150;i++){const x=r()*w,y=r()*h;g.fillStyle=r()<.8?`rgba(${70+r()*30|0},${80+r()*40|0},${200+r()*55|0},.95)`:'rgba(245,245,255,.9)';g.beginPath();g.arc(x,y,.9+r()*1.5,0,TAU);g.fill()}});
  return T})();
const PAT={};for(const k in TEX)PAT[k]=ctx.createPattern(TEX[k],'repeat');
function treeSprite(kind,seed){return tex(128,128,g=>{const r=mulberry32(seed),R=50,oak=kind==='oak';
  const pal=oak?['#20391a','#345f27','#4b8134','#77a84c']:['#172e1f','#23482b','#336337','#4f8246'],cl=[];
  for(let i=0;i<(oak?12:7);i++){const a=r()*TAU,d=Math.sqrt(r())*R*(oak?.56:.4);cl.push({x:64+Math.cos(a)*d,y:64+Math.sin(a)*d,r:R*(oak?.3+r()*.2:.36+r()*.2)})}
  const lay=(col,k,sh)=>{g.fillStyle=col;for(const c of cl){g.beginPath();g.arc(c.x+sh*c.r,c.y+sh*c.r,c.r*k,0,TAU);g.fill()}};
  lay(pal[0],1,.06);lay(pal[1],.9,-.02);lay(pal[2],.6,-.24);g.globalAlpha=.8;lay(pal[3],.27,-.44);
  g.globalCompositeOperation='source-atop';g.globalAlpha=.4;for(let i=0;i<260;i++){const a=r()*TAU,d=Math.sqrt(r())*R;g.fillStyle=r()<.5?pal[0]:pal[3];g.fillRect(64+Math.cos(a)*d,64+Math.sin(a)*d,2,2)}})}
const SPR={oak:[11,12,13,14].map(s=>treeSprite('oak',s)),cedar:[21,22,23].map(s=>treeSprite('cedar',s)),
  shadow:tex(64,64,g=>softDot(g,32,32,32,'6,18,8',.62)),
  rock:[31,32,33].map(s=>tex(96,96,g=>{const r=mulberry32(s),n=7+Math.floor(r()*3),p=[];for(let i=0;i<n;i++){const a=i/n*TAU+r()*.5,d=28+r()*13;p.push([48+Math.cos(a)*d,48+Math.sin(a)*d])}
    const poly=(dx,dy)=>{g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x+dx,y+dy):g.moveTo(x+dx,y+dy));g.closePath()};
    poly(0,0);g.fillStyle='#8f8a7b';g.fill();g.save();g.clip();poly(-5,-6);g.fillStyle='#c9c4b4';g.fill();poly(-12,-14);g.fillStyle='#e6e2d6';g.fill();
    g.strokeStyle='rgba(60,55,45,.5)';g.lineWidth=1.5;for(let i=0;i<3;i++){g.beginPath();g.moveTo(20+r()*56,20+r()*56);g.lineTo(20+r()*56,20+r()*56);g.stroke()}g.restore()}))};

// ───────── geometry (world units are yards; +x east, +y south)
function catmull(P,step){const out=[];for(let i=0;i<P.length-1;i++){const a=P[Math.max(0,i-1)],b=P[i],c=P[i+1],d=P[Math.min(P.length-1,i+2)],n=Math.max(2,Math.ceil(hyp(c.x-b.x,c.y-b.y)/step));
  for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t,f=(p0,p1,p2,p3)=>.5*(2*p1+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);out.push({x:f(a.x,b.x,c.x,d.x),y:f(a.y,b.y,c.y,d.y)})}}
  out.push({x:P[P.length-1].x,y:P[P.length-1].y});return out}

const MU={green:2.2,fringe:4,fairway:5,tee:5,rough:13,bunker:26,woods:15,water:13,rock:13};
const ROLLX={green:1.1,fringe:1,fairway:1,tee:1,rough:.35,bunker:.04,woods:.3,water:0,rock:.6};
const LIE={green:'Green',fringe:'Fringe',fairway:'Fairway',tee:'Tee',rough:'Rough',bunker:'Bunker'};
const CLUBS=[
  {id:'CH',name:'Chip',carry:38,loft:33,roll:.55,tw:90},
  {id:'PW',name:'Wedge',carry:95,loft:49,roll:.035,tw:75},
  {id:'8I',name:'8 Iron',carry:135,loft:41,roll:.05,tw:66},
  {id:'5I',name:'5 Iron',carry:170,loft:35,roll:.07,tw:58},
  {id:'3W',name:'3 Wood',carry:205,loft:30,roll:.09,tw:50},
  {id:'DR',name:'Driver',carry:240,loft:27,roll:.11,tw:45}];
const PUTTER={id:'PT',name:'Putter',putt:true,tw:80};
const lieMult=(lie,c)=>lie==='rough'?.8:lie==='bunker'?(c.id==='PW'||c.id==='CH'?.8:.55):1;

// ───────── day, saves
const KEY='flicklinks:v2:',SHARE_URL='',BUILD_TS=1795373405000; // build.sh stamps the build time here
const pad=n=>String(n).padStart(2,'0');
const todayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function dayNumber(k){const[y,m,d]=k.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(2026,10,22))/864e5)+1}
function store(k,v){try{v==null?localStorage.removeItem(KEY+k):localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
function fetchKey(k){try{return JSON.parse(localStorage.getItem(KEY+k)||'null')}catch(e){return null}}
// one par 3, one par 4 and one par 5 from the nine, played in card order
function dailyIds(key){const r=mulberry32(hashStr('fl-day:'+key)),by=p=>COURSE.holes.map((h,i)=>h.par===p?i:-1).filter(i=>i>=0),pick=a=>a[Math.floor(r()*a.length)];
  return[pick(by(3)),pick(by(4)),pick(by(5))].sort((a,b)=>a-b)}

const S={mode:'title',key:'',day:1,holes:[],round:{type:'daily',ids:[0,1,2],scores:[]},hi:0,strokes:0,lie:'tee',clubs:[],ci:0,club:CLUBS[5],
  ball:{x:0,y:0,z:0,vx:0,vy:0,vz:0,air:false,spin:0,club:null,putt:false,gone:false,tree:null,rollK:1},prev:{x:0,y:0},g:null,trail:[],fx:[],parts:[],hintShots:0,muted:false,mark:{x:0,y:0},pmode:'aim'};
const cur=()=>S.holes[S.round.ids[S.hi]];
const maxScore=()=>cur().par+MAX_OVER;
const saveKey=()=>S.key+(S.round.type==='nine'?':nine':'');
function save(){const n=S.round.ids.length;store(saveKey(),{ids:S.round.ids,scores:S.round.scores,hi:S.hi,strokes:S.strokes,bx:S.ball.x,by:S.ball.y,done:S.round.scores.length>=n})}

// ───────── sound (starts on the first touch)
let AC=null;
function ac(){if(S.muted)return null;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f0,f1,d,type,vol,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function hiss(d,vol,freq,q=1){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start()}
const sfx={
  hit:p=>{hiss(.12,.25+.3*p,2400,.7);tone(420,110,.09,'triangle',.25+.2*p)},
  putt:()=>tone(900,500,.05,'triangle',.22),
  land:()=>hiss(.08,.2,500,1),
  sand:()=>hiss(.22,.35,1400,.6),
  leaf:()=>{hiss(.3,.4,3200,.8);tone(160,90,.08,'triangle',.2)},
  clack:()=>{tone(1900,900,.05,'square',.16);tone(700,300,.06,'triangle',.2)},
  splash:()=>{hiss(.5,.45,900,.5);tone(300,80,.3,'sine',.15)},
  tick:()=>tone(1500,1200,.03,'sine',.07),
  pure:()=>{tone(1320,1760,.12,'sine',.14,.02);tone(1760,2640,.16,'sine',.1,.1)},
  cup:()=>{tone(700,500,.06,'square',.12);tone(520,380,.07,'square',.12,.09);tone(880,1320,.25,'sine',.2,.2)},
  bad:()=>tone(220,120,.25,'sawtooth',.1)};

// ───────── camera: focus point sits at (W/2, H*ay); r rotates the target to straight up
const cam={x:0,y:0,s:1,r:0,ay:.5},camT={x:0,y:0,s:1,r:0,ay:.5};
function toScreen(x,y){const v=rotv(x-cam.x,y-cam.y,cam.r);return{x:W/2+v.x*cam.s,y:H*cam.ay+v.y*cam.s}}
function overviewCam(ay,frac,snap){const h=cur(),t=h.tee,p=h.pin,L=hyp(p.x-t.x,p.y-t.y)||1,ux=(p.x-t.x)/L,uy=(p.y-t.y)/L;
  let a0=0,a1=L,l0=0,l1=0;for(let i=0;i<h.route.pts.length;i+=4){const q=h.route.pts[i],dx=q.x-t.x,dy=q.y-t.y,al=dx*ux+dy*uy,la=-dx*uy+dy*ux;a0=Math.min(a0,al);a1=Math.max(a1,al);l0=Math.min(l0,la);l1=Math.max(l1,la)}
  const am=(a0+a1)/2,lm=(l0+l1)/2;
  camT.x=t.x+ux*am-uy*lm;camT.y=t.y+uy*am+ux*lm;camT.s=Math.min(H*frac/(a1-a0+80),W/(l1-l0+110));camT.r=-Math.PI/2-Math.atan2(uy,ux);camT.ay=ay;if(snap)Object.assign(cam,camT)}
const markDist=()=>hyp(S.mark.x-S.ball.x,S.mark.y-S.ball.y);
function reachOf(c){return c.putt?markDist():c.carry*lieMult(S.lie,c)*(1+c.roll)}
function aimCam(){const h=cur(),b=S.ball,d=hyp(b.x-h.pin.x,b.y-h.pin.y);
  const t=d<=255?h.pin:rAt(h.route,Math.min(h.total,rProj(h.route,b)+225));
  const view=S.club.putt?clamp(Math.max(d,markDist())*1.3,7,70):clamp(Math.min(d*1.18,reachOf(S.club)*1.15),7,430);
  camT.x=b.x;camT.y=b.y;camT.ay=.74;camT.s=H*.56/view;if(d>.4)camT.r=-Math.PI/2-Math.atan2(t.y-b.y,t.x-b.x)}
function updateCam(dt){
  if(S.mode==='flight'&&!S.ball.putt){camT.x=S.ball.x;camT.y=S.ball.y;camT.ay=.6}
  const k=1-Math.exp(-dt*(S.mode==='flight'?7:4.2));
  cam.x=lerp(cam.x,camT.x,k);cam.y=lerp(cam.y,camT.y,k);cam.s=lerp(cam.s,camT.s,k);cam.ay=lerp(cam.ay,camT.ay,k);cam.r=angTo(cam.r,camT.r,k)}

// ───────── shot setup
function setupShot(){const h=cur(),b=S.ball;let lie=lieAt(h,b);if(!LIE[lie])lie='rough';S.lie=lie;
  const d=hyp(b.x-h.pin.x,b.y-h.pin.y),long=CLUBS.filter(c=>c.id!=='DR'||lie==='tee');
  const pickClub=l=>{const i=l.findIndex(c=>!c.putt&&c.carry*lieMult(lie,c)*(1+c.roll)*.94>=d);return i<0?l.length-1:i};
  let list,ci;
  if(lie==='green'){list=[PUTTER];ci=0}
  else if(lie==='fringe'){list=[PUTTER,...long];ci=d<=13?0:pickClub(list)}
  else{list=long;ci=pickClub(list)}
  S.clubs=list;S.ci=ci;S.club=list[ci];placeMarker()}
// the aim marker starts a foot and a half past the cup on the straight line; tap-ins skip the read
function placeMarker(){const h=cur(),b=S.ball,dx=h.pin.x-b.x,dy=h.pin.y-b.y,d=hyp(dx,dy)||1,past=Math.min(.5,d*.25);
  S.mark={x:h.pin.x+dx/d*past,y:h.pin.y+dy/d*past};S.pmode=d<1.4?'stroke':'aim'}
function setBall(x,y){Object.assign(S.ball,{x,y,z:0,vx:0,vy:0,vz:0,air:false,spin:0,putt:false,gone:false,tree:null,rollK:1});S.trail.length=0}
function changeClub(d){if(S.mode!=='ready')return;S.ci=clamp(S.ci+d,0,S.clubs.length-1);S.club=S.clubs[S.ci];placeMarker();aimCam();hud()}

// ───────── swing
// Pull back to set aim and power. A ring at the touch point fills in TU ms, drains and fills again.
// Flick forward through the touch point as the ring tops out: the gap from the top is the timing error.
const DEAD=.045,FLICK_V=.5,TU=950,TD=450;
const pullMax=()=>clamp(H*.18,84,132);
const timingWindow=()=>S.club.tw*(S.lie==='rough'?.8:S.lie==='bunker'?.7:1);
function meterAt(g,t){if(!g.t0)return{f:0,e:-TU};const tau=(t-g.t0)%(TU+TD);return tau<TU?{f:tau/TU,e:tau-TU}:{f:1-(tau-TU)/TD,e:tau-TU}}
function gPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{
  ac();
  if(S.mode==='intro'){clearTimeout(introT);S.mode='ready';aimCam();return}
  if(S.mode!=='ready'||S.g)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=gPos(e);hintOff();
  if(S.club.putt&&S.pmode==='aim'){S.g={id:e.pointerId,drag:true,x:p.x,y:p.y};return}
  S.g={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y,phase:'aim',power:0,aim:null,last:{t:e.timeStamp,d:0},peak:{x:p.x,y:p.y,d:0},fast:0,slow:0,top:null,pull:0,trail:[],t0:0,ft:0,e:0,frozen:null,tick:0,
    off:Math.abs(performance.now()-e.timeStamp)<3000?0:performance.now()-e.timeStamp}; // timing uses each touch's own timestamp, not when it was processed
  S.mode='aim'});
cv.addEventListener('pointermove',e=>{const g=S.g;if(!g||e.pointerId!==g.id)return;
  if(g.drag){const p=gPos(e),w=rotv(p.x-g.x,p.y-g.y,-cam.r),b=S.ball;g.x=p.x;g.y=p.y;
    let mx=S.mark.x+w.x/cam.s*.75,my=S.mark.y+w.y/cam.s*.75;const d=hyp(mx-b.x,my-b.y),k=d>70?70/d:d<.3?0:1;
    if(k){S.mark.x=b.x+(mx-b.x)*k;S.mark.y=b.y+(my-b.y)*k}hudClub();return}
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const ev of(evs.length?evs:[e])){if(!S.g)break;const p=gPos(ev);sample(ev.timeStamp||e.timeStamp,p.x,p.y)}});
function aimFrom(g,x,y,len,t){g.power=clamp(len/pullMax(),0,1);g.aim=len>5?{x:(g.ox-x)/len,y:(g.oy-y)/len}:null;if(!g.t0&&len>14)g.t0=t+g.off}
function toSwing(g){const k=g.peak,m=meterAt(g,g.ft||performance.now());g.phase='swing';g.slow=0;g.top={x:k.x,y:k.y};g.pull=k.d;g.power=clamp(k.d/pullMax(),0,1);
  g.aim={x:(g.ox-k.x)/k.d,y:(g.oy-k.y)/k.d};g.trail=[{x:k.x,y:k.y}];g.e=m.e;g.frozen=m.f}
// A resting finger sends no events, so the gap before a sample is capped: whatever moved, moved within about a frame.
function sample(t,x,y){const g=S.g,len=hyp(x-g.ox,y-g.oy),vr=(g.last.d-len)/clamp(t-g.last.t,4,20);
  g.x=x;g.y=y;g.last={t,d:len};
  if(g.phase==='aim'){
    if(vr>FLICK_V&&g.peak.d>pullMax()*.16){if(!g.fast)g.ft=t+g.off;g.fast++;if(g.fast>=2||g.peak.d-len>g.peak.d*.25)toSwing(g)}
    else{g.fast=0;g.peak={x,y,d:len};aimFrom(g,x,y,len,t)}}
  if(g.phase==='swing'){g.trail.push({x,y});
    if((x-g.top.x)*g.aim.x+(y-g.top.y)*g.aim.y>=g.pull)commit(x,y);
    else if(vr<.05){if(++g.slow>=3){g.phase='aim';g.fast=0;g.frozen=null;g.peak={x,y,d:len};aimFrom(g,x,y,len,t)}}else g.slow=0}}
function commit(x,y){const g=S.g,fx=x-g.top.x,fy=y-g.top.y,b=S.ball;
  const dev=Math.atan2(g.aim.x*fy-g.aim.y*fx,g.aim.x*fx+g.aim.y*fy);let aw=rotv(g.aim.x,g.aim.y,-cam.r),p=g.power;
  if(S.club.putt){const d=markDist()||1;aw={x:(S.mark.x-b.x)/d,y:(S.mark.y-b.y)/d};p=1}
  S.fx.push({type:'swing',pts:g.trail.slice(),t0:performance.now()});
  const te=g.e;endGesture();fire(p,aw,dev,{x:g.ox,y:g.oy},te)}
function endGesture(){const g=S.g;if(!g)return;try{cv.releasePointerCapture(g.id)}catch(_){}S.g=null;if(S.mode==='aim')S.mode='ready'}
function onUp(e){const g=S.g;if(!g||e.pointerId!==g.id)return;
  if(g.drag){endGesture();aimCam();hud();return}
  if(g.phase==='aim'&&g.fast>0)toSwing(g);
  if(g.phase==='swing'){const prog=(g.x-g.top.x)*g.aim.x+(g.y-g.top.y)*g.aim.y;if(prog>=g.pull*.35)return commit(g.x,g.y)}
  const strong=g.power>.3;endGesture();if(strong)hintOn('Flick forward through the ring to swing')}
cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',e=>{if(S.g&&e.pointerId===S.g.id)endGesture()});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// p is power 0..1, aim a world direction, dev the flick's angle off the pull line, te the timing error in ms (early is negative)
function fire(p,aim,dev,at,te){const b=S.ball,c=S.club;te=te||0;
  p=clamp(p,.03,1);S.prev={x:b.x,y:b.y};S.strokes++;S.hintShots++;save();
  const w=timingWindow(),ae=Math.abs(te),q=ae<=w?0:clamp((ae-w)/(320-w),0,1),ts=Math.sign(te);
  const ad=Math.abs(dev),kf=ad<=DEAD?0:Math.sign(dev)*clamp((ad-DEAD)/.35,0,1),over=Math.sign(dev)*Math.max(0,ad-DEAD),pure=q===0&&kf===0;
  b.club=c;b.putt=!!c.putt;b.z=0;b.gone=false;b.rollK=1;S.trail.length=0;
  b.tree=cur().oaks.find(t=>hyp(b.x-t.x,b.y-t.y)<t.r)||null; // a ball already under an oak can be played out from beneath it
  let word,sub=q===0?'Perfect tempo':(q<.25?'A touch ':'')+(ts<0?'early':'late');
  if(c.putt){const pace=ts<0?1-.24*q:1+.2*q,d=rotv(aim.x,aim.y,over*.5+ts*q*.04),v=Math.sqrt(2*MU.green*markDist()*p*pace);b.vx=d.x*v;b.vy=d.y*v;b.vz=0;b.air=false;b.spin=0;
    word=pure?'Pure roll':kf>0?'Pushed':kf<0?'Pulled':ts<0?'Left short':'Hit firm';sfx.putt();store('putts',(fetchKey('putts')||0)+1)}
  else{const th=c.loft*DEG,carry=p*c.carry*lieMult(S.lie,c)*(1-.3*Math.pow(q,1.5)),v=Math.sqrt(carry*G/Math.sin(2*th)),k=clamp(kf+ts*q*.9,-1.2,1.2),d=rotv(aim.x,aim.y,over*.3+ts*q*.05);
    b.vx=d.x*v*Math.cos(th);b.vy=d.y*v*Math.cos(th);b.vz=v*Math.sin(th);b.air=true;b.spin=k*.16*G/Math.tan(th);
    word=pure?'Pured it':Math.abs(k)<.06?'Straight':Math.abs(k)<.3?(k>0?'Fade':'Draw'):(k>0?'Slice':'Hook');sfx.hit(p);
    if(S.lie==='bunker'){burst(b.x,b.y,K.sand,22,10,7);sfx.sand()}else if(S.lie!=='tee')burst(b.x,b.y,'#5a8d3d',8,6,5)}
  if(pure)sfx.pure();
  if(at)S.fx.push({type:'word',text:word,sub,good:pure,x:at.x,y:at.y-44,t0:performance.now()});
  try{navigator.vibrate&&navigator.vibrate(pure?[10,40,10]:25)}catch(_){}
  S.mode='flight';hud()}

// ───────── ball physics, fixed 240 Hz steps
const STEP=1/240;
function stepBall(dt){const b=S.ball,h=cur();
  if(b.air){const sp=hyp(b.vx,b.vy)||1,px=-b.vy/sp,py=b.vx/sp;
    b.vx+=(h.wind.x*KW+px*b.spin)*dt;b.vy+=(h.wind.y*KW+py*b.spin)*dt;b.vz-=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
    for(const t of h.oaks)if(b.tree!==t&&b.z>2.5&&b.z<t.h&&hyp(b.x-t.x,b.y-t.y)<t.r*.85){b.tree=t;b.vx*=.12;b.vy*=.12;b.vz=Math.min(b.vz,0)-1;b.spin=0;b.rollK=.2;sfx.leaf();burst(b.x,b.y,'#4b8134',16,10,5);toast('Into the oak',1000)}
    if(b.z<=0){b.z=0;let lie=lieAt(h,b);
      if(lie==='water')return hazard('water');
      if(hyp(b.x-h.pin.x,b.y-h.pin.y)<CUP_R)return holed();
      if(lie==='rock'&&b.vz<-5){const a=(hashStr(Math.round(b.x*8)+':'+Math.round(b.y*8))%1000/1000-.5)*1.7,d=rotv(b.vx,b.vy,a);
        b.vx=d.x*.42;b.vy=d.y*.42;b.vz=Math.min(15,-b.vz*.5);b.z=.02;b.spin=0;b.rollK=.3;sfx.clack();burst(b.x,b.y,K.stone,8,7,5);return}
      const carry=hyp(b.x-S.prev.x,b.y-S.prev.y),v=Math.sqrt(2*MU[lie]*carry*b.club.roll*ROLLX[lie]*b.rollK),s2=hyp(b.vx,b.vy)||1;
      b.vx=b.vx/s2*v;b.vy=b.vy/s2*v;b.vz=Math.min(9,-b.vz*.22)*(lie==='bunker'?0:lie==='rough'||lie==='woods'?.5:1);b.air=false;
      if(lie==='bunker'){sfx.sand();burst(b.x,b.y,K.sand,18,8,6)}else sfx.land()}
    return}
  if(b.z>0||b.vz>0){b.vz-=G*dt;b.z+=b.vz*dt;if(b.z<=0){b.z=0;b.vz=-b.vz*.4;if(b.vz<1.2)b.vz=0}}
  const lie=lieAt(h,b),mu=MU[lie];
  if(lie==='water'&&b.z<=.01)return hazard('water');
  if(lie==='green'||lie==='fringe'){const a=slopeAt(h,b);b.vx+=a.x*dt;b.vy+=a.y*dt}
  const sp=hyp(b.vx,b.vy);
  if(b.z<.05&&sp<CAP_V&&hyp(b.x-h.pin.x,b.y-h.pin.y)<CUP_R)return holed();
  if(sp<=mu*dt){b.vx=b.vy=0;if(b.z<=0&&b.vz<=0)return atRest()}
  else{const k=(sp-mu*dt)/sp;b.vx*=k;b.vy*=k}
  b.x+=b.vx*dt;b.y+=b.vy*dt}
function hazard(kind){const b=S.ball;S.mode='wait';b.gone=true;S.strokes++;
  S.fx.push({type:'ring',x:b.x,y:b.y,t0:performance.now(),water:kind==='water'});
  if(kind==='water'){sfx.splash();burst(b.x,b.y,'#d8f4f0',22,9,9)}else sfx.bad();
  toast(kind==='water'?'In the water':'Lost in the trees','One stroke penalty',1700);hud();
  setTimeout(()=>{setBall(S.prev.x,S.prev.y);afterShot()},1500)}
function atRest(){if(lieAt(cur(),S.ball)==='woods')return hazard('woods');afterShot()}
function afterShot(){if(S.strokes>=maxScore()){toast('Picked up','The most a hole can cost is '+maxScore(),1600);return finishHole(maxScore())}
  const was=S.lie;setupShot();if(S.lie!==was&&(S.lie==='green'||S.lie==='bunker'))toast(S.lie==='green'?'On the green':'In the bunker','',1100);
  S.mode='ready';aimCam();hud();save()}
function holed(){const b=S.ball,h=cur();b.x=h.pin.x;b.y=h.pin.y;b.vx=b.vy=b.vz=b.z=0;b.air=false;b.gone=true;sfx.cup();
  S.fx.push({type:'ring',x:b.x,y:b.y,t0:performance.now()});finishHole(S.strokes)}
function finishHole(score){S.mode='wait';S.round.scores[S.hi]=score;S.strokes=0;const n=S.round.ids.length,last=S.hi>=n-1;
  store(saveKey(),{ids:S.round.ids,scores:S.round.scores,hi:Math.min(n-1,S.hi+1),strokes:0,bx:0,by:0,done:last});
  if(last&&S.round.type==='daily')bumpStreak();setTimeout(()=>holeCard(score),900)}
function bumpStreak(){const m=fetchKey('meta')||{last:0,streak:0};if(m.last===S.day)return;m.streak=m.last===S.day-1?m.streak+1:1;m.last=S.day;store('meta',m)}

// ───────── frame loop
let last=0,acc=0,hudTick=0,windDeg=1e9,Q=2,slowFrames=0;const LOCKQ=location.hash==='#dev';
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!cur())return;
  if(S.mode==='flight'){acc+=dt;while(acc>=STEP&&S.mode==='flight'){stepBall(STEP);acc-=STEP}
    const b=S.ball;S.trail.push({x:b.x,y:b.y,z:b.z});if(S.trail.length>(b.putt?10:26))S.trail.shift();
    if((hudTick+=dt)>.1){hudTick=0;hudDist()}}else acc=0;
  // step the picture quality down on a phone that cannot hold thirty frames a second
  if(dt>.034)slowFrames++;else slowFrames=Math.max(0,slowFrames-2);if(slowFrames>70&&Q>0&&!LOCKQ){Q--;slowFrames=0;resize()}
  const g=S.g;if(g&&!g.drag&&g.t0&&g.phase==='aim'){const tk=Math.floor((performance.now()-g.t0+TD)/(TU+TD));if(tk>g.tick){g.tick=tk;sfx.tick()}}
  updateCam(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawWorld(now);drawPreview(now);drawFlag(now);drawBall(dt);drawVignette();drawGesture(now);
  if(S.fx.length>12)S.fx.splice(0,S.fx.length-12);
  const ws=rotv(cur().wind.x,cur().wind.y,cam.r),deg=Math.round(Math.atan2(ws.y,ws.x)/DEG+90);
  if(deg!==windDeg){windDeg=deg;$('windArrow').style.transform=`rotate(${deg}deg)`}}
function resize(){const r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);DPR=Math.min([1,1.5,2][Q],window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);VIG=null;
  if(S.holes.length){if(S.mode==='ready')aimCam();else if(S.mode==='title')overviewCam(.2,.3,true)}}
addEventListener('resize',resize);

// ───────── plaques
function hudDist(){const h=cur(),b=S.ball,d=hyp(b.x-h.pin.x,b.y-h.pin.y),ft=d<20&&lieAt(h,b)==='green';
  $('hDist').textContent=ft?Math.max(1,Math.round(d*3)):Math.round(d);$('hUnit').textContent=ft?'ft to pin':'yd to pin'}
function hudClub(){const h=cur(),c=S.club,m=lieMult(S.lie,c);$('clubName').textContent=c.name;
  if(c.putt){const dp=(phiAt(h,h.pin)-phiAt(h,S.ball))/15.7*36,n=Math.round(Math.abs(dp));
    $('clubMax').textContent=Math.round(markDist()*3)+' ft pace · '+(n<1?'level':(dp>0?'up ':'down ')+n+' in')}
  else $('clubMax').textContent=Math.round(c.carry*m)+' yd · '+(LIE[S.lie]||'Rough')+(m<1?' −'+Math.round((1-m)*100)+'%':'')}
function hud(){const h=cur(),c=S.club,n=S.round.ids.length,ready=S.mode==='ready'||S.mode==='aim'||S.mode==='intro';
  $('hHole').textContent=`No. ${h.n} · Par ${h.par} · ${h.yards} yd`;$('hName').textContent=h.name;
  $('hStroke').textContent='Shot '+(S.mode==='flight'||S.mode==='wait'?Math.max(1,S.strokes):S.strokes+1)+(S.round.type==='nine'?'':' · hole '+(S.hi+1)+' of '+n);
  $('hWind').textContent=h.wind.sp;hudDist();hudClub();
  $('clubPrev').disabled=S.ci<=0;$('clubNext').disabled=S.ci>=S.clubs.length-1;
  const pb=$('btnPutt');pb.hidden=!(c.putt&&ready);pb.textContent=S.pmode==='aim'?'Putt':'Aim';
  if(c.putt&&ready&&(fetchKey('putts')||0)<8){if(S.pmode==='aim')hintOn('Drag to place the marker, then press Putt');else hintOn('Pull back, flick up as the ring fills')}else if(c.putt)hintOff()}
let toastT=0;function toast(s,sub,ms){if(typeof sub==='number'){ms=sub;sub=''}const t=$('toast');t.textContent=s;if(sub){const e=document.createElement('small');e.textContent=sub;t.appendChild(e)}
  t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||1400)}
function hintOn(s){const e=$('hint');e.textContent=s;e.style.opacity=1}
function hintOff(){$('hint').style.opacity=0}
$('clubPrev').onclick=()=>changeClub(-1);$('clubNext').onclick=()=>changeClub(1);
$('btnSound').onclick=()=>{S.muted=!S.muted;$('btnSound').setAttribute('aria-pressed',String(!S.muted));store('muted',S.muted);if(!S.muted)sfx.putt()};
$('btnHelp').onclick=()=>{if(S.mode==='ready')helpCard()};
$('btnPutt').onclick=()=>{if(S.mode!=='ready'||!S.club.putt)return;S.pmode=S.pmode==='aim'?'stroke':'aim';aimCam();hud()};
// ───────── clubhouse stationery
const CREST='<svg viewBox="0 0 54 62" aria-hidden="true"><path d="M4 4h46v30c0 13-10 21-23 25C14 55 4 47 4 34z" fill="#14493a" stroke="#b9933b" stroke-width="2.5"/><path d="M9.500 9.500h35v24.500c0 9.500-7.500 16-17.500 19.500-10-3.500-17.500-10-17.500-19.500z" fill="none" stroke="#e6cf8a" stroke-width=".9"/><path d="M14 42l6-10 6 3 5-8 9 15z" fill="#cfcabb"/><path d="M20 32l6 3 5-8 2 3-6 9z" fill="#8f8a7b"/><path d="M27 13v14" stroke="#f4ecd6" stroke-width="1.6" stroke-linecap="round"/><path d="M27.500 13.500l9 3.200-9 3.200z" fill="#c9283a"/></svg>';
const HOW=`<div class="how">
<figure><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="24" r="9" fill="none" stroke="#e6cf8a" stroke-width="4"/><path d="M48 35v36" stroke="#f4ecd6" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M41 62l7 9 7-9" fill="none" stroke="#f4ecd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="78" r="11" fill="#f4ecd6" opacity=".45"/></svg><figcaption>Pull back to aim. Farther means harder.</figcaption></figure>
<figure><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="50" r="26" fill="none" stroke="#0b2a21" stroke-opacity=".55" stroke-width="11"/><path d="M48 76A26 26 0 0 1 26 36" fill="none" stroke="#f4ecd6" stroke-width="7" stroke-linecap="round"/><path d="M48 76A26 26 0 0 0 70 36" fill="none" stroke="#f4ecd6" stroke-width="7" stroke-linecap="round"/><path d="M39 25.600A26 26 0 0 1 57 25.600" fill="none" stroke="#e6cf8a" stroke-width="11"/><path d="M48 62V40M41 47l7-8 7 8" fill="none" stroke="#e6cf8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><figcaption>Flick up the moment the ring fills.</figcaption></figure>
<figure><svg viewBox="0 0 96 96" aria-hidden="true"><path d="M48 84V44" stroke="#f4ecd6" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M48 84C48 56 42 34 24 14" fill="none" stroke="#c9283a" stroke-width="5" stroke-linecap="round"/><path d="M48 84C48 56 54 34 72 14" fill="none" stroke="#c9283a" stroke-width="5" stroke-linecap="round"/><text x="17" y="42" font-size="11" fill="#f4ecd6" font-family="Georgia,serif" font-style="italic">early</text><text x="60" y="42" font-size="11" fill="#f4ecd6" font-family="Georgia,serif" font-style="italic">late</text></svg><figcaption>Early hooks it. Late slices it.</figcaption></figure></div>`;
function sheet(html){$('card').innerHTML=html;$('scrim').hidden=false;$('card').scrollTop=0;const b=$('card').querySelector('.btn');if(b)try{b.focus({preventScroll:true})}catch(e){}}
function closeSheet(){$('scrim').hidden=true;$('card').innerHTML=''}
const rel=n=>n===0?'E':(n>0?'+':'−')+Math.abs(n);
function scoreName(s,par){if(s===1)return'Hole in one';const d=s-par;return d<=-3?'Albatross':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double bogey':d===3?'Triple bogey':rel(d)+' on the hole'}
const emo=(s,par)=>s===1?'🎯':s-par<=-2?'🦅':s-par===-1?'🐦':s===par?'⚪':s-par===1?'🟧':'🟥';
const mk=(s,par)=>{const d=s-par,c=d<=-2?'eagle':d===-1?'birdie':d===1?'bogey':d>=2?'dbl':'';return`<span class="mk ${c}">${s}</span>`};
function scoreCard(ids,scores,note){const hs=ids.map(i=>S.holes[i]),wide=ids.length<=3,par=sum(hs.map(h=>h.par)),n=scores.filter(s=>s!=null).length,done=n>=ids.length;
  const toPar=n?rel(sum(scores.slice(0,n))-sum(hs.slice(0,n).map(h=>h.par))):'',d=new Date();
  const row=(cls,label,cells,out)=>`<tr class="${cls}"><th>${label}</th>${cells.map(c=>`<td>${c}</td>`).join('')}<td class="out">${out}</td></tr>`;
  return`<div class="card-sc"><div class="sc-head">${CREST}<b>${wide?"Today's Three":COURSE.club}</b><span>${note}</span></div>
<table class="sc${wide?' wide':''}">${row('h','Hole',hs.map(h=>h.n),wide?'Total':'Out')}${row('g',COURSE.tee,hs.map(h=>h.yards),sum(hs.map(h=>h.yards)))}
${row('k','Hcp',hs.map(h=>h.hcp),'')}${row('p','Par',hs.map(h=>h.par),par)}
${row('s','You',hs.map((h,i)=>scores[i]!=null?mk(scores[i],h.par):''),done?sum(scores):'')}</table>
<div class="sc-foot"><span>Date <i>${d.getMonth()+1}/${d.getDate()}</i></span><span>Scorer <i>You</i></span><span>To par <i>${toPar}</i></span></div></div>`}
const dateLine=()=>`No. ${S.day} · `+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function titleCard(){const ids=dailyIds(S.key),d=fetchKey(S.key),seen=fetchKey('seen');
  S.mode='title';S.round={type:'daily',ids,scores:d&&d.scores?d.scores.slice():[]};S.hi=0;setBall(0,0);setupShot();overviewCam(.2,.3,true);hud();hintOff();
  sheet(`<div class="mast">${CREST}<h1>Flick Links</h1></div>
<div class="flourish"></div><p class="eyebrow stamp"><span>${dateLine()}</span><span id="buildAge">${buildAge()}</span></p>
${scoreCard(ids,d&&d.scores?d.scores:[],COURSE.club)}
<div class="row"><button class="btn" data-act="daily">Today's three</button><button class="btn green" data-act="nine">Front nine</button></div>
${seen?'':HOW}`)}
function helpCard(){sheet(`<h2>How to play</h2>${HOW}
<p class="fine"><b>The swing.</b> The dotted line shows where a pure strike lands. A ring at your thumb fills, drains and fills again. Flick through it as it tops out. Early loses distance and hooks. Late loses distance and slices. Longer clubs and bad lies give a smaller window.</p>
<p class="fine"><b>On the green.</b> The moving streaks run downhill, faster and warmer where it is steep. Drag to place the marker where a flat putt should stop, press Putt, then pull back and flick on the ring. A mistimed putt comes up short or runs long.</p>
<p class="fine">Water and the woods cost one stroke. A live oak will knock a low ball down.</p>
<button class="btn" data-act="close">Carry on</button>`)}
function holeCard(score){const h=cur(),last=S.hi>=S.round.ids.length-1,nx=last?null:S.holes[S.round.ids[S.hi+1]];
  sheet(`<p class="eyebrow">No. ${h.n} · ${h.name} · Par ${h.par}</p><h2>${scoreName(score,h.par)}</h2>
<p class="sub">${score===1?'One swing. Frame the card.':score+' strokes'+(score>=maxScore()?', the most a hole can cost.':'.')}</p>
${scoreCard(S.round.ids,S.round.scores,S.round.type==='nine'?'Front nine · practice':COURSE.club)}
<button class="btn" data-act="${last?'results':'next'}">${last?'Sign the card':'On to No. '+nx.n+'<small>'+nx.name+' · Par '+nx.par+' · '+nx.yards+' yd</small>'}</button>`)}
function shareText(){const r=S.round,hs=r.ids.map(i=>S.holes[i]),par=sum(hs.map(h=>h.par)),tot=sum(r.scores);
  let t=r.type==='nine'?`⛳ Flick Links · front nine at ${COURSE.club}\n`+r.scores.map((s,i)=>emo(s,hs[i].par)).join('')+`\n${tot} strokes (${rel(tot-par)})`
    :`⛳ Flick Links No. ${S.day}\n`+r.scores.map((s,i)=>`#${hs[i].n} ${emo(s,hs[i].par)} ${s}`).join('   ')+`\n${tot} strokes (${rel(tot-par)})`;
  let url=SHARE_URL;try{if(!url&&window.top===window.self&&/^https?:$/.test(location.protocol))url=location.origin+location.pathname}catch(e){}
  return url?t+'\n'+url:t}
function resultsCard(){const r=S.round,sv=fetchKey(saveKey());if(sv&&sv.scores)r.scores=sv.scores;
  const hs=r.ids.map(i=>S.holes[i]),d=sum(r.scores)-sum(hs.map(h=>h.par)),m=fetchKey('meta'),nine=r.type==='nine';
  S.mode='done';S.hi=r.ids.length-1;setBall(0,0);setupShot();hud();hintOff();store('seen',1);overviewCam(.16,.24,false);
  sheet(`<p class="eyebrow">${nine?'Practice round · front nine':dateLine()}</p><h2>${sum(r.scores)} strokes, ${d===0?'even par':d<0?Math.abs(d)+' under':d+' over'}</h2>
${scoreCard(r.ids,r.scores,nine?'Front nine · practice':COURSE.club)}
<textarea id="shareText" readonly rows="3" aria-label="Your result, ready to paste">${shareText()}</textarea>
<div class="row"><button class="btn" data-act="share">Share score</button><button class="btn ghost" data-act="${nine?'again':'title'}">${nine?'Play it again':'Clubhouse'}</button></div>
${nine?'<button class="btn ghost" data-act="title">Clubhouse</button>':''}
<p class="fine" id="shareNote">${nine?'Practice rounds do not change today\'s card.':(m&&m.streak>1?`Day streak <b>${m.streak}</b>. `:'')+'New holes in <b id="countdown">--:--:--</b>.'}</p>`);tickClock()}
async function share(){const ta=$('shareText'),text=ta.value,note=$('shareNote');let top=false;try{top=window.top===window.self}catch(e){}
  if(top&&navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);note.textContent='Copied. Paste it in the group chat.'}
  catch(e){ta.focus();ta.select();note.textContent='Press and hold the score above to copy it.'}}
function buildAge(){const m=Math.floor((Date.now()-BUILD_TS)/6e4);return'Updated '+(m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' hr ago':Math.floor(m/1440)+' d ago')}
function tickClock(){const a=$('buildAge');if(a)a.textContent=buildAge();const e=$('countdown');if(!e)return;const n=new Date(),next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((next-n)/1000));
  e.textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
setInterval(()=>{tickClock();if(S.key&&todayKey()!==S.key&&(S.mode==='done'||S.mode==='title'))initDay()},1000);
$('card').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;ac();
  if(a==='daily'||a==='nine')begin(a);
  else if(a==='again'){store(S.key+':nine',null);begin('nine')}
  else if(a==='close')closeSheet();
  else if(a==='next'){closeSheet();startHole(S.hi+1)}
  else if(a==='results')resultsCard();
  else if(a==='title')titleCard();
  else if(a==='share')share()});

// ───────── flow
let introT=0;
function startHole(i,sv){closeSheet();S.hi=i;const h=cur();S.strokes=sv?sv.strokes||0:0;setBall(sv&&sv.strokes?sv.bx:h.tee.x,sv&&sv.strokes?sv.by:h.tee.y);setupShot();
  if(S.strokes>=maxScore())return finishHole(maxScore());
  overviewCam(.5,.7,false);S.mode='intro';hud();toast(`No. ${h.n} · ${h.name}`,`Par ${h.par} · ${h.yards} yards · Handicap ${h.hcp}`,2000);
  if(S.hintShots<3&&!fetchKey('seen'))hintOn('Pull back to aim, flick up as the ring fills');
  clearTimeout(introT);introT=setTimeout(()=>{if(S.mode==='intro'){S.mode='ready';aimCam()}},1900);save()}
function begin(type){const ids=type==='nine'?COURSE.holes.map((_,i)=>i):dailyIds(S.key);S.round={type,ids,scores:[]};const sv=fetchKey(saveKey());
  if(sv&&sv.done&&Array.isArray(sv.scores)){S.round.scores=sv.scores;return resultsCard()}
  if(sv&&Array.isArray(sv.scores)&&sv.hi>=0&&sv.hi<ids.length){S.round.scores=sv.scores.slice(0,sv.hi);startHole(sv.hi,sv)}else startHole(0)}
function initDay(){S.key=todayKey();S.day=dayNumber(S.key);S.holes=COURSE.holes.map(d=>buildHole(d,S.key));S.muted=!!fetchKey('muted');
  $('btnSound').setAttribute('aria-pressed',String(!S.muted));titleCard()}
// ───────── boot, and staying current while a round is open
// A new build can arrive mid-round: the round is saved after every stroke, so it resumes where it stood.
const PLAYING=['intro','ready','aim','flight','wait'];
function start(d){resize();initDay();resize();let r=d&&d.playing?d:null;
  try{const s=JSON.parse(sessionStorage.getItem(KEY+'resume')||'null');sessionStorage.removeItem(KEY+'resume');if(s&&s.playing)r=s}catch(e){}
  if(r&&(r.type==='daily'||r.type==='nine')){begin(r.type);if(PLAYING.includes(S.mode))toast('Updated to the latest build','Carrying on where you were',2200)}}
const snap=()=>({type:S.round.type,playing:PLAYING.includes(S.mode)});
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(snap)}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
requestAnimationFrame(frame);
// On its own web address the page checks for a newer build every 20 seconds and reloads between shots.
let standalone=false;try{standalone=window.top===window.self&&/^https?:$/.test(location.protocol)}catch(e){}
if(standalone)setInterval(async()=>{if(document.hidden||S.mode==='aim'||S.mode==='flight')return;
  try{const t=await(await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text(),m=t.match(/BUILD_TS=(\d{10,})/);
    if(m&&+m[1]>BUILD_TS){try{sessionStorage.setItem(KEY+'resume',JSON.stringify(snap()))}catch(e){}location.replace(location.pathname+'?v='+m[1]+location.hash)}}catch(e){}},20000);

if(location.hash==='#dev')window.__fl={S,cam,camT,fire,cur,lieAt,begin,startHole,overviewCam,closeSheet,COURSE};
})();
</script>
