<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Flick Links">
<meta property="og:description" content="Three holes a day on the front nine. Same holes for everyone. Fewest strokes wins the group chat.">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flick Links</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Marcellus+SC&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap">
<style>
/* Layout: a full-bleed aerial of the hole on one canvas. Brass-ruled green plaques sit on the screen edges,
   and every menu is a sheet of clubhouse card stock that rises from the bottom, where the thumb already is. */
:root{
  --club:#14493a; --club-deep:#0b2a21; --club-hi:#1f6450; --cream:#f4ecd6; --paper:#f8f2e0; --paper-2:#efe6cb;
  --ink:#1c2620; --ink-2:#56604f; --gold:#b9933b; --gold-hi:#e6cf8a; --claret:#7b1e2b; --claret-deep:#561420;
  --pencil:#33373a; --rule:#2b5a48; --tee-gold:#ead9a0; --white:#ffffff;
  --display:'Playfair Display','Hoefler Text','Baskerville','Georgia',serif;
  --caps:'Copperplate','Copperplate Gothic Light','Marcellus SC','Georgia',serif;
  --hand:'Kalam','Bradley Hand','Comic Sans MS',cursive;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--club-deep)}
body{height:100%;background:var(--club-deep);color:var(--ink);font-family:var(--display);font-size:14px;overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;cursor:crosshair}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud.top{top:10px;align-items:flex-start}
.hud.bottom{bottom:8px;align-items:flex-end}
.plate{pointer-events:none;color:var(--cream);background:linear-gradient(180deg,var(--club-hi),var(--club) 45%,var(--club-deep));
  border:1px solid var(--gold);border-radius:9px;box-shadow:inset 0 0 0 2px rgba(11,42,33,.55),inset 0 1px 0 3px rgba(230,207,138,.12),0 4px 10px rgba(0,0,0,.4)}
button.plate,.plate button{pointer-events:auto}
.lbl{font:400 11px/1 var(--caps);letter-spacing:.11em;text-transform:uppercase;color:var(--gold-hi)}
.num{font:800 30px/0.9 var(--display);font-variant-numeric:lining-nums tabular-nums}

.holeinfo{display:flex;flex-direction:column;gap:4px;padding:8px 12px 8px;max-width:58vw}
.holeinfo b{font:italic 700 17px/1.05 var(--display)}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pin{display:grid;grid-template-columns:auto auto;justify-content:end;align-items:baseline;column-gap:6px;row-gap:5px;padding:8px 13px 9px}
.pin .last{grid-column:1/-1;justify-self:end;color:var(--cream);opacity:.85;font-size:10px}
.wind{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 7px}
.wind .num{font-size:20px}
.wind svg{width:24px;height:24px;display:block}
.wind svg path{fill:var(--gold-hi)}

.club{display:flex;align-items:center;gap:2px;padding:3px}
.club button{width:38px;height:40px;border-radius:7px;font:800 24px/1 var(--display);color:var(--gold-hi)}
.club button:active{background:rgba(230,207,138,.18)}
.club button:disabled{opacity:.3}
.club button:disabled{visibility:hidden}
.clubtxt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:118px;padding:0 4px}
.clubtxt b{font:800 17px/1 var(--display)}
.round{width:34px;height:34px;border-radius:50%;font:800 15px/1 var(--display);display:grid;place-items:center}
.go{min-width:104px;height:48px;padding:2px 18px 0;font:400 15px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,#93283a,var(--claret) 55%,var(--claret-deep))}
.go:active{transform:translateY(2px)}
.round[aria-pressed="false"]{color:rgba(244,236,214,.45);text-decoration:line-through}
.tools{display:flex;gap:6px}

#app.tut .hud.top{display:none}
#coach{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;padding:11px 13px 12px;
  color:var(--ink);background:linear-gradient(180deg,var(--paper),var(--paper-2));border-radius:8px;box-shadow:inset 0 0 0 1px var(--gold),0 6px 16px rgba(0,0,0,.4)}
#coach .lbl{color:var(--ink-2)}
#coach b{font:italic 700 21px/1.05 var(--display);color:var(--club)}
#coach p{font:600 14px/1.35 var(--display);min-height:2.7em}
#coach .btn{min-height:42px}
#coach .btn:disabled{opacity:.4;box-shadow:none}
#hint,#toast{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;transition:opacity .25s}
#hint{bottom:70px;white-space:nowrap;font:italic 700 16px/1.2 var(--display);color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.55)}
#toast{top:128px;width:max-content;max-width:calc(100% - 32px);background:var(--paper);color:var(--ink);padding:10px 18px 9px;border-radius:4px;
  font:italic 700 17px/1.2 var(--display);opacity:0;box-shadow:inset 0 0 0 1px var(--gold),0 6px 16px rgba(0,0,0,.4)}
#toast.on{opacity:1}
#toast small{display:block;margin-top:5px;font:400 11px/1 var(--caps);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}

#scrim{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,22,17,.42)}
#card{width:min(100%,480px);max-height:92%;overflow-y:auto;box-sizing:border-box;color:var(--ink);
  background:repeating-linear-gradient(93deg,rgba(120,100,50,.035) 0 1px,transparent 1px 4px),linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:10px 10px 0 0;border-top:1px solid var(--gold);
  padding-block:20px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.45);animation:rise .34s cubic-bezier(.2,.9,.3,1.05)}
@keyframes rise{from{transform:translateY(46px);opacity:.3}to{transform:none;opacity:1}}
#card>*{flex-shrink:0}
#card.still{animation:none}
@media (prefers-reduced-motion:reduce){#card{animation:none}#hint,#toast{transition:none}}

.mast{display:flex;align-items:center;gap:12px}
.mast svg{width:54px;height:62px;flex:none}
.mast h1{margin:0;font:italic 700 40px/0.95 var(--display);letter-spacing:-.01em;color:var(--club)}
.mast p{margin:5px 0 0;font:400 11.5px/1.25 var(--caps);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.stamp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stamp span:last-child{color:var(--claret)}
.eyebrow{margin:0;font:400 11.5px/1.3 var(--caps);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
h2{margin:0;font:italic 700 31px/1.02 var(--display);color:var(--club);text-wrap:balance}
p{margin:0;line-height:1.45}
.sub{font:600 15px/1.4 var(--display);color:var(--ink)}
.fine{font:600 12.5px/1.45 var(--display);color:var(--ink-2)}
.fine b{color:var(--ink);font-variant-numeric:tabular-nums}
.flourish{height:9px;background:linear-gradient(var(--gold),var(--gold)) center/100% 1px no-repeat;position:relative}
.flourish::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px var(--paper)}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.how figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.how svg{width:100%;height:auto;border-radius:4px;display:block;background:linear-gradient(160deg,#6aa84a,#4c8a3a);box-shadow:inset 0 0 0 1px var(--club)}
.how figcaption{font:600 12.5px/1.3 var(--display)}

.btn{min-height:52px;border-radius:6px;padding:2px 18px 0;font:400 15px/1.1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--cream);
  background:linear-gradient(180deg,#93283a,var(--claret));border:1px solid var(--gold);box-shadow:inset 0 0 0 2px rgba(86,20,32,.6),0 3px 0 var(--claret-deep)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(86,20,32,.6),0 1px 0 var(--claret-deep)}
.btn.green{background:linear-gradient(180deg,var(--club-hi),var(--club));box-shadow:inset 0 0 0 2px rgba(11,42,33,.6),0 3px 0 var(--club-deep)}
.btn.ghost{background:transparent;color:var(--club);border:1px solid var(--club);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px rgba(20,73,58,.35)}
.btn.ghost:active{transform:none;background:rgba(20,73,58,.08)}
.btn small{display:block;margin-top:4px;font:italic 600 12px/1 var(--display);letter-spacing:0;text-transform:none;opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 150px}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn.sm{flex:1 1 96px;min-height:46px;padding:2px 6px 0;font-size:12.5px;letter-spacing:.09em}

/* the scorecard: printed stock, pencil marks */
.card-sc{border:1.5px solid var(--rule);background:var(--paper);box-shadow:0 2px 0 rgba(43,90,72,.18)}
.sc-head{display:flex;align-items:center;gap:9px;background:var(--club);color:var(--cream);padding:7px 10px}
.sc-head svg{width:22px;height:25px;flex:none}
.sc-head b{font:400 13px/1.15 var(--caps);letter-spacing:.14em;text-transform:uppercase}
.sc-head span{margin-left:auto;font:italic 600 12.5px/1 var(--display);color:var(--gold-hi);white-space:nowrap}
table.sc{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:lining-nums tabular-nums}
.sc th,.sc td{border:1px solid var(--rule);padding:5px 0 4px;text-align:center;font:600 13px/1 var(--display);overflow:hidden}
.sc th{width:48px;font:400 9.5px/1 var(--caps);letter-spacing:.09em;text-transform:uppercase;color:var(--rule);text-align:left;padding-left:6px}
.sc.wide th{width:74px}
.sc tr.h td,.sc tr.h th{background:var(--club);color:var(--cream);border-color:var(--club-hi);font:400 12px/1 var(--caps);padding-block:6px 5px}
.sc tr.g td,.sc tr.g th{background:var(--tee-gold)}
.sc tr.n td{font:800 15px/1 var(--display)}
.sc tr.h td{white-space:nowrap}
.sc tr.p td{font-weight:800;font-size:14px}
.sc tr.k td{font:italic 600 11.5px/1 var(--display);color:var(--ink-2)}
.sc tr.s td{height:38px;padding:0;font:700 23px/1 var(--hand);color:var(--pencil)}
.sc tr.s th{color:var(--ink)}
.sc td.out{border-left:3px double var(--rule);width:44px;font-weight:800}
.sc.wide td.out{width:74px}
.mk{display:inline-grid;place-items:center;width:27px;height:27px;padding-top:3px;box-sizing:border-box}
.mk.birdie,.mk.eagle{border:1.6px solid var(--pencil);border-radius:52% 48% 50% 50%/48% 52% 47% 53%;transform:rotate(-4deg)}
.mk.eagle{box-shadow:0 0 0 2px var(--paper),0 0 0 3.4px var(--pencil)}
.mk.bogey,.mk.dbl{border:1.6px solid var(--pencil);border-radius:2px 4px 3px 5px;transform:rotate(2deg)}
.mk.dbl{box-shadow:0 0 0 2px var(--paper),0 0 0 3.4px var(--pencil)}
.sc-foot{display:flex;gap:14px;padding:8px 10px 7px;font:400 9.5px/1 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--rule)}
.sc-foot span{flex:1;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--rule);padding-bottom:2px;min-width:0}
.sc-foot i{font:400 17px/0.8 var(--hand);color:var(--pencil);letter-spacing:0;text-transform:none;white-space:nowrap}

/* the clubhouse */
.mast .chip{margin-left:auto}
.chip{max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:8px 12px 7px;font:600 13px/1 var(--display);color:var(--club);background:rgba(255,255,255,.5)}
.strip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px rgba(20,73,58,.22)}
.strip span{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.strip b{font:italic 700 18px/1.1 var(--display);color:var(--club);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip i{font:600 12.5px/1.25 var(--display);font-style:normal;color:var(--ink-2)}
.strip em{font:400 11.5px/1 var(--caps);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:var(--club);border-radius:4px;padding:8px 10px 7px}
.strip.warn{border-color:var(--claret);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px rgba(123,30,43,.3)}
.strip.warn b{color:var(--claret)}
.strip.warn em{background:var(--claret)}
#saveNote:empty{display:none}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font:400 11.5px/1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.field input{font:600 19px/1.2 var(--display);color:var(--ink);padding:11px 12px;border:1px solid var(--rule);border-radius:4px;background:#fffdf6;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.field input:focus{outline:2px solid var(--gold);outline-offset:1px}
.err{color:var(--claret);min-height:1.3em}
.link{align-self:flex-start;padding:6px 0;font:italic 600 14px/1.2 var(--display);color:var(--club);text-decoration:underline}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--club);border-radius:6px;overflow:hidden}
.tabs button{padding:11px 4px 9px;font:400 12px/1 var(--caps);letter-spacing:.11em;text-transform:uppercase;color:var(--club)}
.tabs button+button{border-left:1px solid var(--club)}
.tabs button[aria-selected="true"]{background:var(--club);color:var(--cream)}
.lb{list-style:none;margin:0;padding:0;border:1.5px solid var(--rule);background:var(--paper)}
.lb li{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:34px}
.lb li+li{border-top:1px solid rgba(43,90,72,.35)}
.lb li.me,.st tr.me td{background:rgba(234,217,160,.5)}
.lb .rk{width:16px;font:800 15px/1 var(--display);color:var(--club)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 15px/1.2 var(--display)}
.lb .hs{display:flex;gap:2px;font:700 20px/1 var(--hand);color:var(--pencil)}
.lb .hs .mk{width:25px;height:25px}
.lb .tt{min-width:58px;text-align:right;font:800 17px/1 var(--display);font-variant-numeric:lining-nums tabular-nums}
.lb .tt small,.stats small{margin-left:6px;font:700 13.5px/1 var(--display);color:var(--claret)}
.lb .wait{font:italic 600 13px/1 var(--display);color:var(--ink-2)}
table.st{width:100%;border-collapse:collapse;border:1.5px solid var(--rule);background:var(--paper);font-variant-numeric:lining-nums tabular-nums}
.st th{background:var(--club);color:var(--cream);font:400 10px/1 var(--caps);letter-spacing:.09em;text-transform:uppercase;padding:7px 4px 6px}
.st td{border-top:1px solid rgba(43,90,72,.35);padding:8px 4px;text-align:center;font:600 14px/1 var(--display)}
.st th:first-child,.st td:first-child{text-align:left;padding-left:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st td b{font-weight:800;font-size:16px;color:var(--club)}
.stats{display:grid;grid-template-columns:1fr;border:1.5px solid var(--rule);background:var(--paper)}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stats div{display:flex;flex-direction:column;gap:6px;padding:10px 8px;min-width:0}
.stats div+div{border-left:1px solid rgba(43,90,72,.35)}
.stats b{font:800 24px/1 var(--display);color:var(--club);font-variant-numeric:lining-nums}
.stats span{font:400 10px/1.2 var(--caps);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.rec{list-style:none;margin:0;padding:0;border:1.5px solid var(--rule);background:var(--paper)}
.rec li{display:flex;align-items:center;gap:9px;padding:5px 10px;min-height:32px;font:600 13.5px/1.2 var(--display)}
.rec li+li{border-top:1px solid rgba(43,90,72,.35)}
.rec li>span:first-child{width:44px;color:var(--ink-2)}
.rec .mk{font:700 19px/1 var(--hand);color:var(--pencil);width:25px;height:25px}
.rec small{font:italic 600 12px/1 var(--display);color:var(--ink-2)}
.mono{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font:800 12px/1 var(--display);font-style:normal;color:var(--club-deep);
  background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold));box-shadow:inset 0 0 0 1.5px rgba(86,62,10,.5)}
.tro{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tro div{display:grid;grid-template-columns:auto 1fr;column-gap:9px;row-gap:3px;align-items:center;padding:8px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);opacity:.5;min-width:0}
.tro div.won{opacity:1;box-shadow:inset 0 0 0 1px var(--gold)}
.tro .mono{grid-row:span 2}
.tro b{font:700 13.5px/1.1 var(--display);align-self:end}
.tro span{font:600 11.5px/1.2 var(--display);color:var(--ink-2);align-self:start}
#shareText{width:100%;box-sizing:border-box;resize:none;border:1px dashed var(--rule);border-radius:3px;background:rgba(255,255,255,.55);
  color:var(--ink);padding:9px 11px;font:600 15px/1.4 var(--display);-webkit-user-select:text;user-select:text}
</style>

<div id="app">
  <canvas id="c" aria-label="Aerial view of the golf hole. Pull back to aim, then flick forward to swing."></canvas>

  <div class="hud top">
    <div class="plate holeinfo">
      <span class="lbl" id="hHole">No. 1 · Par 4 · 423 yd</span>
      <b id="hName">First Tee</b>
      <span class="lbl" id="hStroke">Shot 1</span>
    </div>
    <div class="stack">
      <div class="plate pin"><span class="num" id="hDist">356</span><span class="lbl" id="hUnit">yd to pin</span><span class="lbl last" id="hLast" hidden></span></div>
      <div class="plate wind" title="Wind">
        <svg id="windArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l6 9h-4v11h-4V11H6z"/></svg>
        <span class="num" id="hWind">0</span><span class="lbl">mph</span>
      </div>
      <div class="tools">
        <button class="plate round" id="btnSound" aria-label="Sound" aria-pressed="true">♪</button>
        <button class="plate round" id="btnHelp" aria-label="How to play">?</button>
      </div>
    </div>
  </div>

  <div id="coach" hidden>
    <span class="lbl" id="coachStep">Driving range</span>
    <b id="coachTitle">The swing</b>
    <p id="coachText"></p>
    <div class="row"><button class="btn sm ghost" id="coachSkip">Skip</button><button class="btn sm" id="coachNext" disabled>Putting</button></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hint"></div>

  <div class="hud bottom">
    <div class="plate club">
      <button id="clubPrev" aria-label="Shorter club">‹</button>
      <div class="clubtxt"><b id="clubName">Driver</b><span class="lbl" id="clubMax">240 yd · Tee</span></div>
      <button id="clubNext" aria-label="Longer club">›</button>
    </div>
    <button class="plate go" id="btnPutt" hidden>Putt</button>
  </div>

  <div id="scrim" hidden><div id="card" role="dialog" aria-modal="true" aria-label="Flick Links"></div></div>
</div>

// ───────── rules of this little world

// ───────── day, saves

// ───────── shot setup
function setupShot(){const h=cur(),b=S.ball;let lie=lieAt(h,b);if(!LIE[lie])lie='rough';S.lie=lie;

// ───────── swing
// Pull back to set aim and power. A ring at the touch point fills in TU ms, slowly at first and quicker toward the top,
// then drains in TD and fills again. Flick forward through the touch point as it tops out.
// How full the ring is at the flick decides the strike: the top is pure, the upper part is decent, the bottom third is a shank.

cv.addEventListener('pointerdown',e=>{

const LocalServer=(()=>{

// The page also carries a copy, backed by browser storage, so a lone player has a working clubhouse offline.
//
// Who you are: a random session token, kept in an HttpOnly cookie and stored here only as a hash.

const enc=new TextEncoder();

// ───────── what a clubhouse shows

// ───────── passkeys (WebAuthn): the server keeps a public key; the phone proves it holds the private one
function derToRaw(der){let o=der[1]&0x80?2+(der[1]&0x7f):2;const int=()=>{if(der[o++]!==2)throw new Error('der');const len=der[o++];let v=der.slice(o,o+len);o+=len;
    while(v.length>32&&v[0]===0)v=v.slice(1);const out=new Uint8Array(32);out.set(v,32-v.length);return out};
  const r=int(),s=int(),raw=new Uint8Array(64);raw.set(r);raw.set(s,32);return raw}
async function importKey(k){const spki=unb64u(k.spki);
  if(k.alg===-7)return crypto.subtle.importKey('spki',spki,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  if(k.alg===-257)return crypto.subtle.importKey('spki',spki,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);
  throw new Error('alg')}
async function checkClientData(store,cdj,type,origin){let c;try{c=JSON.parse(new TextDecoder().decode(cdj))}catch(e){return null}
  if(c.type!==type||c.origin!==origin||typeof c.challenge!=='string')return null;
  const ch=await store.get('ch:'+c.challenge);if(!ch)return null;await store.del('ch:'+c.challenge);return Date.now()-ch.t<3e5?ch:null}

// ───────── the API
async function handle(req,store,opts={}){const url=new URL(req.url),path=url.pathname.replace(/^\/api/,''),m=req.method,origin=url.protocol+'//'+url.host;
  try{
    if(m==='GET'&&path==='/ping')return json({ok:true,v:1});
    let ses=await session(req,store);
    if(m==='GET'&&path==='/state'){const day=validDay(url.searchParams.get('day'))||numDay(Math.floor(Date.now()/864e5));return json({ok:true,...await state(store,ses,day,url.searchParams.get('club'))})}
    if(m!=='POST')return fail('not_found',404);
    const o=req.headers.get('origin');if(o&&o!==origin&&!opts.local)return fail('bad_origin',403);
    const b=await req.json().catch(()=>({})),head={},extra={};
    const signIn=async pid=>{const tok=await newSession(store,pid);head['set-cookie']=cookieFor(tok,url);if(opts.local)extra.session=tok};
    const done=(o={})=>json({ok:true,...o,...extra},200,head);
    switch(path){
      case'/player':{const name=cleanName(b.name);if(name.length<1)return fail('name');
        if(ses){ses.player.name=name;await store.put('p:'+ses.pid,ses.player)}
        else{const pid=b64u(rand(9));await store.put('p:'+pid,{id:pid,name,created:Date.now(),clubs:[],keys:[]});await signIn(pid)}
        return done()}
      case'/club':{if(!ses)return fail('no_player',401);const name=cleanName(b.name,24),nick=cleanName(b.nick)||ses.player.name;if(name.length<2)return fail('name');
        if((ses.player.clubs||[]).length>=8)return fail('too_many');
        let code;do{code=[...rand(6)].map(x=>CODE[x%CODE.length]).join('')}while(await store.get('c:'+code));
        await store.put('c:'+code,{code,name,owner:ses.pid,created:Date.now()});await store.put('m:'+code+':'+ses.pid,{nick,joined:Date.now()});
        ses.player.clubs=[...(ses.player.clubs||[]),code];await store.put('p:'+ses.pid,ses.player);return done({code})}
      case'/join':{if(!ses)return fail('no_player',401);const code=String(b.code||'').toUpperCase(),club=await store.get('c:'+code),nick=cleanName(b.nick)||ses.player.name;if(!club)return fail('no_club',404);
        const ms=await store.list('m:'+code+':'),mine=ms.find(x=>x.k==='m:'+code+':'+ses.pid);
        if(!mine&&ms.length>=50)return fail('full');if(ms.some(x=>x!==mine&&x.v.nick.toLowerCase()===nick.toLowerCase()))return fail('taken');
        await store.put('m:'+code+':'+ses.pid,{nick,joined:mine?mine.v.joined:Date.now()});
        if(!(ses.player.clubs||[]).includes(code)){if((ses.player.clubs||[]).length>=8)return fail('too_many');ses.player.clubs=[...(ses.player.clubs||[]),code];await store.put('p:'+ses.pid,ses.player)}
        return done({code})}
      case'/leave':{if(!ses)return fail('no_player',401);const code=String(b.code||'').toUpperCase();await store.del('m:'+code+':'+ses.pid);
        ses.player.clubs=(ses.player.clubs||[]).filter(c=>c!==code);await store.put('p:'+ses.pid,ses.player);return done()}
      case'/round':{if(!ses)return fail('no_player',401);const day=validDay(b.day),h=b.holes,p=b.pars,s=b.scores;
        if(!day||Math.abs(dayNum(day)-Math.floor(Date.now()/864e5))>1)return fail('day');
        if(![h,p,s].every(a=>Array.isArray(a)&&a.length===3)||!h.every(x=>/^[a-z]{2}[1-9]$/.test(x))||new Set(h).size!==3)return fail('holes');
        if(!p.every(x=>x===3||x===4||x===5)||!s.every((x,i)=>Number.isInteger(x)&&x>=1&&x<=p[i]+5))return fail('scores');
        const key='r:'+ses.pid+':'+day;if(!(await store.get(key)))await store.put(key,{day,holes:h,pars:p,scores:s,tot:total(s),par:total(p),ts:Date.now()}); // the first card of the day stands
        return done()}
      case'/passkey/options':{const challenge=b64u(rand(32));await store.put('ch:'+challenge,{pid:ses?ses.pid:null,t:Date.now()});
        if(b.kind==='create'){if(!ses)return fail('no_player',401);
          return done({publicKey:{challenge,rp:{name:'Flick Links',id:url.hostname},user:{id:b64u(enc.encode(ses.pid)),name:ses.player.name,displayName:ses.player.name},
            pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{residentKey:'required',userVerification:'preferred'},attestation:'none',timeout:60000}})}
        return done({publicKey:{challenge,rpId:url.hostname,userVerification:'preferred',timeout:60000}})}
      case'/passkey/create':{if(!ses)return fail('no_player',401);const ch=await checkClientData(store,unb64u(b.clientDataJSON),'webauthn.create',origin);
        if(!ch||ch.pid!==ses.pid)return fail('challenge');const key={id:String(b.id||''),spki:String(b.spki||''),alg:b.alg};
        if(!/^[\w-]{8,400}$/.test(key.id)||await store.get('k:'+key.id))return fail('key');await importKey(key);
        ses.player.keys=[...(ses.player.keys||[]),key].slice(-5);await store.put('p:'+ses.pid,ses.player);await store.put('k:'+key.id,{pid:ses.pid});return done()}
      case'/passkey/login':{const ref=await store.get('k:'+String(b.id||''));if(!ref)return fail('unknown_key',401);const player=await store.get('p:'+ref.pid),key=player&&(player.keys||[]).find(k=>k.id===b.id);if(!key)return fail('unknown_key',401);
        const cdj=unb64u(b.clientDataJSON),auth=unb64u(b.authenticatorData),sig=unb64u(b.signature);if(!(await checkClientData(store,cdj,'webauthn.get',origin)))return fail('challenge',401);
        if(hex(auth.slice(0,32))!==hex(await sha256(url.hostname))||!(auth[32]&1))return fail('auth_data',401);
        const data=new Uint8Array(auth.length+32);data.set(auth);data.set(await sha256(cdj),auth.length);
        const ok=key.alg===-7?await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},await importKey(key),derToRaw(sig),data):await crypto.subtle.verify('RSASSA-PKCS1-v1_5',await importKey(key),sig,data);
        if(!ok)return fail('signature',401);await signIn(ref.pid);return done()}
    }
    return fail('not_found',404)
  }catch(e){return fail('server_error',500)}}

// In memory, optionally mirrored somewhere by a save callback (the page mirrors it to browser storage).
class MemStore{constructor(data,save){this.m=new Map(Object.entries(data||{}));this.save=save||(()=>{})}
  async get(k){return this.m.has(k)?JSON.parse(this.m.get(k)):null}
  async put(k,v){this.m.set(k,JSON.stringify(v));this.save(Object.fromEntries(this.m))}
  async del(k){this.m.delete(k);this.save(Object.fromEntries(this.m))}
  async list(p){return[...this.m.keys()].filter(k=>k.startsWith(p)).sort().map(k=>({k,v:JSON.parse(this.m.get(k))}))}}
// A Cloudflare D1 (SQLite) database used as one key-value table.
class D1Store{constructor(db){this.db=db}
  async init(){await this.db.prepare('CREATE TABLE IF NOT EXISTS kv (k TEXT PRIMARY KEY, v TEXT NOT NULL)').run()}
  async get(k){const r=await this.db.prepare('SELECT v FROM kv WHERE k=?').bind(k).first();return r?JSON.parse(r.v):null}
  async put(k,v){await this.db.prepare('INSERT INTO kv (k,v) VALUES (?,?) ON CONFLICT(k) DO UPDATE SET v=excluded.v').bind(k,JSON.stringify(v)).run()}
  async del(k){await this.db.prepare('DELETE FROM kv WHERE k=?').bind(k).run()}
  async list(p){const r=await this.db.prepare('SELECT k,v FROM kv WHERE k>=? AND k<? ORDER BY k').bind(p,p+'￿').all();return(r.results||[]).map(x=>({k:x.k,v:JSON.parse(x.v)}))}}
return{handle,MemStore}})();

    if(!j.ok)throw j;await refresh()}catch(e){if(note)note.textContent=e&&e.name==='NotAllowedError'?'No passkey was saved.':'This device could not save a passkey.'}}
async function signIn(){const note=$('formErr');try{const o=await Net.call('POST','/passkey/options',{kind:'get'});if(!o.ok)throw o;const pk=o.publicKey;pk.challenge=fromB64(pk.challenge);
    const a=await navigator.credentials.get({publicKey:pk}),r=a.response,j=await Net.call('POST','/passkey/login',{id:a.id,clientDataJSON:toB64(r.clientDataJSON),authenticatorData:toB64(r.authenticatorData),signature:toB64(r.signature)});
    if(!j.ok)throw j;await refresh();titleCard()}catch(e){if(note)note.textContent='No saved player was found on this phone.'}}
async function invite(){const note=$('shareNote'),c=C.club;if(!Net.remote){note.textContent='Invites need the hosted site. This clubhouse is on this device only.';return}
  const url=location.origin+location.pathname+'?c='+c.code,text=`Join ${c.name} on Flick Links. Three holes a day.\n${url}`;
  if(navigator.share)try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);note.textContent='Invite copied.'}catch(e){note.textContent=url}}
$('card').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,kind=f.dataset.kind,say=m=>{$('formErr').textContent=m},nick=$('nickName').value.trim(),btn=f.querySelector('[type=submit]');
  const cname=kind==="club"?$("houseName").value.trim():"";if(!nick)return say(MSG.name);if(kind==='club'&&cname.length<2)return say('Give the clubhouse a name.');
  btn.disabled=true;
  try{const fresh=!C.me;if(fresh||kind==='name'){const j=await Net.call('POST','/player',{name:nick});if(!j.ok)throw j}
    // a new player is saved to the phone's passkey straight away, so two weeks of rounds never hang on a cookie
    if(fresh&&await canPrompt()){btn.textContent='Saving your player';await savePasskey()}
    if(kind==='club'){const j=await Net.call('POST','/club',{name:cname,nick});if(!j.ok)throw j;endInvite();pickClub(j.code)}
    if(kind==='join'){const j=await Net.call('POST','/join',{code:C.invite||C.code,nick});if(!j.ok)throw j;endInvite();pickClub(j.code)}
    await refresh();kind==='name'?meCard():(C.tab='today',clubCard())}
  catch(x){btn.disabled=false;say(MSG[x&&x.error]||'That did not go through. Try again.')}});
// ───────── clubhouse stationery
const CREST='<svg viewBox="0 0 54 62" aria-hidden="true"><path d="M4 4h46v30c0 13-10 21-23 25C14 55 4 47 4 34z" fill="#14493a" stroke="#b9933b" stroke-width="2.5"/><path d="M9.500 9.500h35v24.500c0 9.500-7.500 16-17.500 19.500-10-3.500-17.500-10-17.500-19.500z" fill="none" stroke="#e6cf8a" stroke-width=".9"/><path d="M14 42l6-10 6 3 5-8 9 15z" fill="#cfcabb"/><path d="M20 32l6 3 5-8 2 3-6 9z" fill="#8f8a7b"/><path d="M27 13v14" stroke="#f4ecd6" stroke-width="1.6" stroke-linecap="round"/><path d="M27.500 13.500l9 3.200-9 3.200z" fill="#c9283a"/></svg>';
const HOW=`<div class="how">
<figure><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="24" r="9" fill="none" stroke="#e6cf8a" stroke-width="4"/><path d="M48 35v36" stroke="#f4ecd6" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M41 62l7 9 7-9" fill="none" stroke="#f4ecd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="78" r="11" fill="#f4ecd6" opacity=".45"/></svg><figcaption>Pull back to aim. Farther means harder.</figcaption></figure>
<figure><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="50" r="26" fill="none" stroke="#0b2a21" stroke-opacity=".55" stroke-width="11"/><path d="M48 76A26 26 0 0 1 26 36" fill="none" stroke="#f4ecd6" stroke-width="7" stroke-linecap="round"/><path d="M48 76A26 26 0 0 0 70 36" fill="none" stroke="#f4ecd6" stroke-width="7" stroke-linecap="round"/><path d="M39 25.600A26 26 0 0 1 57 25.600" fill="none" stroke="#e6cf8a" stroke-width="11"/><path d="M48 62V40M41 47l7-8 7 8" fill="none" stroke="#e6cf8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><figcaption>Flick up the moment the ring fills.</figcaption></figure>
<figure><svg viewBox="0 0 96 96" aria-hidden="true"><path d="M48 84V44" stroke="#f4ecd6" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M48 84C48 56 42 34 24 14" fill="none" stroke="#c9283a" stroke-width="5" stroke-linecap="round"/><path d="M48 84C48 56 54 34 72 14" fill="none" stroke="#c9283a" stroke-width="5" stroke-linecap="round"/><text x="17" y="42" font-size="11" fill="#f4ecd6" font-family="Georgia,serif" font-style="italic">early</text><text x="60" y="42" font-size="11" fill="#f4ecd6" font-family="Georgia,serif" font-style="italic">late</text></svg><figcaption>Early hooks, late slices. Far too early shanks.</figcaption></figure></div>`;
// again is the function that redraws this sheet when fresh clubhouse data arrives; a redraw keeps its scroll and skips the entrance
let redrawFn=null;
function sheet(html,again){const c=$('card'),same=!!again&&redrawFn===again&&!$('scrim').hidden,top=c.scrollTop;c.classList.toggle('still',same);c.innerHTML=html;$('scrim').hidden=false;c.scrollTop=same?top:0;redrawFn=again||null;
  if(!same){const b=c.querySelector('input')||c.querySelector('.btn');if(b)try{b.focus({preventScroll:true})}catch(e){}}}
function closeSheet(){$('scrim').hidden=true;$('card').innerHTML='';redrawFn=null}
function redraw(){if(redrawFn&&!$('scrim').hidden)redrawFn()}
const rel=n=>n===0?'E':(n>0?'+':'−')+Math.abs(n);
function scoreName(s,par){if(s===1)return'Hole in one';const d=s-par;return d<=-3?'Albatross':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double bogey':d===3?'Triple bogey':rel(d)+' on the hole'}
const emo=(s,par)=>s===1?'🎯':s-par<=-2?'🦅':s-par===-1?'🐦':s===par?'⚪':s-par===1?'🟧':'🟥';
const mk=(s,par)=>{const d=s-par,c=d<=-2?'eagle':d===-1?'birdie':d===1?'bogey':d>=2?'dbl':'';return`<span class="mk ${c}">${s}</span>`};
// a round's card. Today's three can mix courses, so it carries a course row; a practice nine carries its tee.
function scoreCard(ids,scores){const hs=ids.map(HOLE),wide=ids.length<=3,par=sum(hs.map(h=>h.par)),n=scores.filter(s=>s!=null).length,done=n>=ids.length,c=hs[0].course;
  const toPar=n?rel(sum(scores.slice(0,n))-sum(hs.slice(0,n).map(h=>h.par))):'',d=new Date();
  const row=(cls,label,cells,out)=>`<tr class="${cls}"><th>${label}</th>${cells.map(x=>`<td>${x}</td>`).join('')}<td class="out">${out}</td></tr>`;
  return`<div class="card-sc"><div class="sc-head">${CREST}<b>${wide?"Today's Three":c.club}</b><span>${wide?'No. '+S.day:'Front nine · practice'}</span></div>
<table class="sc${wide?' wide':''}">${wide?row('h','Course',hs.map(h=>h.course.club),''):''}${row(wide?'n':'h','Hole',hs.map(h=>h.n),wide?'Total':'Out')}
${row('g',wide?'Yards':c.tee,hs.map(h=>h.yards),sum(hs.map(h=>h.yards)))}${row('k','Hcp',hs.map(h=>h.hcp),'')}${row('p','Par',hs.map(h=>h.par),par)}
${row('s','You',hs.map((h,i)=>scores[i]!=null?mk(scores[i],h.par):''),done?sum(scores):'')}</table>
<div class="sc-foot"><span>Date <i>${d.getMonth()+1}/${d.getDate()}</i></span><span>Scorer <i>You</i></span><span>To par <i>${toPar}</i></span></div></div>`}
const dateLine=()=>`No. ${S.day} · `+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
// a day's saved round keeps the holes it was drawn with, so a later change to the draw cannot scramble it
const todaysIds=d=>d&&Array.isArray(d.ids)&&d.ids.length===3&&d.ids.every(i=>ALL[i])?d.ids:dailyIds(S.key);
function titleCard(){const d=fetchKey(S.key),ids=todaysIds(d),seen=fetchKey('seen');
  S.mode='title';S.round={type:'daily',ids,scores:d&&d.scores?d.scores.slice():[]};S.hi=0;setBall(cur().tee.x,cur().tee.y);setupShot();overviewCam(.2,.3,true);hud();hintOff();
  sheet(`<div class="mast">${CREST}<h1>Flick Links</h1>${meChip()}</div>
<div class="flourish"></div><p class="eyebrow stamp"><span>${dateLine()}</span><span id="buildAge">${buildAge()}</span></p>
${scoreCard(ids,d&&d.scores?d.scores:[])}
<button class="btn" data-act="daily">Today's three</button>
${saveStrip()}${clubStrip()}
<p class="eyebrow">Practice a front nine</p>
<div class="pick">${COURSES.map(c=>`<button class="btn green sm" data-act="nine" data-c="${c.id}">${c.club}</button>`).join('')}</div>`,titleCard)}
function helpCard(){sheet(`<h2>How to play</h2>${HOW}
<p class="fine"><b>Putting.</b> Drag the marker to where a flat putt should stop. Press Putt, then flick on gold. The streaks run downhill.</p>
<p class="fine"><b>Trouble.</b> Water: drop at the edge, +1. Out of bounds or lost: replay, +1.</p>
<p class="fine">© OpenStreetMap contributors.</p>
<div class="row"><button class="btn" data-act="close">Carry on</button><button class="btn ghost" data-act="range">Practice range</button></div>`)}
function holeCard(score){const h=cur(),last=S.hi>=S.round.ids.length-1,nx=last?null:HOLE(S.round.ids[S.hi+1]);
  sheet(`<p class="eyebrow">${h.course.club} No. ${h.n} · ${h.name} · Par ${h.par}</p><h2>${scoreName(score,h.par)}</h2>
${scoreCard(S.round.ids,S.round.scores)}
<button class="btn" data-act="${last?'results':'next'}">${last?'Sign the card':'On to '+(S.round.type==='nine'?'':nx.course.club+' ')+'No. '+nx.n+'<small>'+nx.name+' · Par '+nx.par+' · '+nx.yards+' yd</small>'}</button>`)}
function shareText(){const r=S.round,hs=r.ids.map(HOLE),par=sum(hs.map(h=>h.par)),tot=sum(r.scores);
  let t=r.type==='nine'?`⛳ Flick Links · front nine at ${hs[0].course.club}\n`+r.scores.map((s,i)=>emo(s,hs[i].par)).join('')+`\n${tot} strokes (${rel(tot-par)})`
    :`⛳ Flick Links No. ${S.day}\n`+r.scores.map((s,i)=>`${hs[i].course.code}${hs[i].n} ${emo(s,hs[i].par)} ${s}`).join('   ')+`\n${tot} strokes (${rel(tot-par)})`;
  let url=SHARE_URL;try{if(!url&&window.top===window.self&&/^https?:$/.test(location.protocol))url=location.origin+location.pathname+(Net.remote&&C.code?'?c='+C.code:'')}catch(e){}
  return url?t+'\n'+url:t}
function resultsCard(){const r=S.round,sv=fetchKey(saveKey());if(sv&&sv.scores)r.scores=sv.scores;
  const hs=r.ids.map(HOLE),d=sum(r.scores)-sum(hs.map(h=>h.par)),m=fetchKey('meta'),nine=r.type==='nine';
  S.mode='done';S.hi=r.ids.length-1;setBall(cur().tee.x,cur().tee.y);setupShot();hud();hintOff();store('seen',1);overviewCam(.16,.24,false);
  sheet(`<p class="eyebrow">${nine?'Practice round · '+hs[0].course.club:dateLine()}</p><h2>${sum(r.scores)} strokes, ${d===0?'even par':d<0?Math.abs(d)+' under':d+' over'}</h2>
${scoreCard(r.ids,r.scores)}
<textarea id="shareText" readonly rows="${shareText().split('\n').length}" aria-label="Your result, ready to paste">${shareText()}</textarea>
<div class="row"><button class="btn" data-act="share">Share score</button><button class="btn ghost" data-act="${nine?'again':'title'}">${nine?'Play it again':'Home'}</button></div>
${nine?'':saveStrip()}${nine?'<button class="btn ghost" data-act="title">Home</button>':C.club&&C.club.member?'<p class="eyebrow">'+esc(C.club.name)+' today</p>'+tabToday(C.club)+'<button class="btn green" data-act="club">Open the clubhouse</button>':clubStrip()}
<p class="fine" id="shareNote">${nine?'':(m&&m.streak>1?`Day streak <b>${m.streak}</b>. `:'')+'New holes in <b id="countdown">--:--:--</b>.'}</p>`,nine?null:resultsCard);tickClock()}
async function share(){const ta=$('shareText'),text=ta.value,note=$('shareNote');let top=false;try{top=window.top===window.self}catch(e){}
  if(top&&navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);note.textContent='Copied.'}
  catch(e){ta.focus();ta.select();note.textContent='Press and hold the score to copy.'}}
function buildAge(){const m=Math.floor((Date.now()-BUILD_TS)/6e4);return'Updated '+(m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' hr ago':Math.floor(m/1440)+' d ago')}
function tickClock(){const a=$('buildAge');if(a)a.textContent=buildAge();const e=$('countdown');if(!e)return;const n=new Date(),next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((next-n)/1000));
  e.textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
setInterval(()=>{tickClock();if(S.key&&todayKey()!==S.key&&(S.mode==='done'||S.mode==='title'))initDay()},1000);
$('card').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;ac();
  if(a==='daily'||a==='nine')begin(a,b.dataset.c);
  else if(a==='again'){store(saveKey(),null);begin('nine',S.round.course)}
  else if(a==='close')closeSheet();
  else if(a==='next'){closeSheet();startHole(S.hi+1)}
  else if(a==='results')resultsCard();
  else if(a==='title')titleCard();
  else if(a==='share')share();
  else if(a==='range')startRange();
  else if(a==='me')meCard();
  else if(a==='club'){C.tab='today';clubCard()}
  else if(a==='clubform')formCard('club');
  else if(a==='joinform')formCard('join');
  else if(a==='rename')formCard('name');
  else if(a==='tab'){C.tab=b.dataset.t;clubCard()}
  else if(a==='pick'){pickClub(b.dataset.c);refresh()}
  else if(a==='invite')invite();
  else if(a==='passkey')savePasskey();
  else if(a==='signin')signIn()});

// ───────── flow
let introT=0;
function startHole(i,sv){closeSheet();S.hi=i;S.marks=[];S.shot=null;const h=cur();S.strokes=sv?sv.strokes||0:0;setBall(sv&&sv.strokes?sv.bx:h.tee.x,sv&&sv.strokes?sv.by:h.tee.y);setupShot();
  if(S.strokes>=maxScore())return finishHole(maxScore());
  overviewCam(.5,.76,false);S.mode='intro';hud();toast(`No. ${h.n} · ${h.name}`,h.course.club,1800);
  hintOff();if(S.hintShots<3&&!fetchKey('seen'))hintOn('Pull back to aim, flick up on gold');
  clearTimeout(introT);introT=setTimeout(()=>{if(S.mode==='intro'){S.mode='ready';aimCam()}},1900);save()}
function begin(type,course){const nine=type==='nine';if(nine&&!COURSES.some(c=>c.id===course))course='gr';
  S.round={type,course:nine?course:null,ids:[],scores:[]};const sv=fetchKey(saveKey());S.round.ids=nine?courseIds(course):todaysIds(sv);const ids=S.round.ids;
  if(sv&&sv.done&&Array.isArray(sv.scores)){S.round.scores=sv.scores;return resultsCard()}
  if(sv&&Array.isArray(sv.scores)&&sv.hi>=0&&sv.hi<ids.length){S.round.scores=sv.scores.slice(0,sv.hi);startHole(sv.hi,sv)}else startHole(0)}
function initDay(){S.key=todayKey();S.day=dayNumber(S.key);S.holes=[];S.muted=!!fetchKey('muted');
  $('btnSound').setAttribute('aria-pressed',String(!S.muted));titleCard()}
// ───────── the practice range
// A first visit starts here: hit balls until one is struck well, then roll a putt close. Nothing counts and Skip is always there.
const RANGE_HOLE=()=>courseIds('lp')[7];   // a wide, straight hole to hit down
function coach(step,title,text,next,ready){$('coachStep').textContent='Driving range · '+step;$('coachTitle').textContent=title;$('coachText').textContent=text;const n=$('coachNext');n.textContent=next;n.disabled=!ready}
function rangeSpot(){const h=cur();if(S.tut.step==='swing')return h.tee;const dx=h.tee.x-h.pin.x,dy=h.tee.y-h.pin.y,d=hyp(dx,dy);for(const k of[7,5.5,4,3]){const p={x:h.pin.x+dx/d*k,y:h.pin.y+dy/d*k};if(inSh(h.green,p,-1))return p}return{x:h.green.x,y:h.green.y}}
function rangeSet(){const p=rangeSpot();setBall(p.x,p.y);S.strokes=0;setupShot();S.mode='ready';aimCam();hud()}
function startRange(){closeSheet();S.round={type:'range',ids:[RANGE_HOLE()],scores:[],course:null};S.hi=0;S.marks=[];S.tut={step:'swing',good:false};const h=cur();h.wind.x=h.wind.y=0;h.wind.sp=0;
  rangeSet();hintOff();overviewCam(.5,.76,true);aimCam();coach('1 of 2','The swing','Pull back to aim. Flick up when the ring reaches gold.','Putting',false)}
function rangeAfter(holed,note){const t=S.tut,l=S.last||{},h=cur();
  if(t.step==='swing'){const ok=!note&&!l.shank&&l.q<.5;t.good=t.good||ok;
    coach('1 of 2','The swing',note||(l.shank?'Shank. Wait for the ring to leave the red.':l.pure?'Pure.':ok?'Good strike.':l.early?'Early. Wait for gold.':'Late. Flick as it reaches gold.'),'Putting',t.good)}
  else{const ft=Math.round(hyp(S.ball.x-h.pin.x,S.ball.y-h.pin.y)*3),ok=holed||ft<=4;t.good=t.good||ok;
    coach('2 of 2','The putt',holed?'Holed.':ok?'Close: '+ft+' ft.':ft+' ft away. Move the marker to allow for the slope.','Play',t.good)}
  rangeSet()}
function endRange(){store('tut',1);$('app').classList.remove('tut');$('coach').hidden=true;hintOff();titleCard()}
$('coachSkip').onclick=endRange;
$('coachNext').onclick=()=>{const t=S.tut;if(!t||!t.good)return;if(t.step==='swing'){t.step='putt';t.good=false;S.last=null;rangeSet();coach('2 of 2','The putt','Drag the marker to where a flat putt should stop. Press Putt, then flick on gold.','Play',false)}else endRange()};

// ───────── boot, and staying current while a round is open
// A new build can arrive mid-round: the round is saved after every stroke, so it resumes where it stood.
const PLAYING=['intro','ready','aim','flight','wait'];
function start(d){resize();initDay();resize();let r=d&&d.playing?d:null;if(!r&&!fetchKey('tut'))return startRange();
  try{const s=JSON.parse(sessionStorage.getItem(KEY+'resume')||'null');sessionStorage.removeItem(KEY+'resume');if(s&&s.playing)r=s}catch(e){}
  if(r&&(r.type==='daily'||r.type==='nine')){begin(r.type,r.course);if(PLAYING.includes(S.mode))toast('Updated',1400)}}
const snap=()=>({type:S.round.type,course:S.round.course,playing:PLAYING.includes(S.mode)});
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(snap)}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
try{const q=new URLSearchParams(location.search).get('c');if(q&&/^[A-Za-z0-9]{6}$/.test(q))C.invite=q.toUpperCase()}catch(e){}
Net.ready=Net.init();Net.ready.then(()=>refresh());
requestAnimationFrame(frame);
// On its own web address the page checks for a newer build every 20 seconds and reloads between shots.
let standalone=false;try{standalone=window.top===window.self&&/^https?:$/.test(location.protocol)}catch(e){}
if(standalone)setInterval(async()=>{if(document.hidden||S.mode==='aim'||S.mode==='flight')return;
  try{const t=await(await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text(),m=t.match(/BUILD_TS=(\d{10,})/);
    if(m&&+m[1]>BUILD_TS){try{sessionStorage.setItem(KEY+'resume',JSON.stringify(snap()))}catch(e){}location.replace(location.pathname+'?v='+m[1]+location.hash)}}catch(e){}},20000);

if(location.hash==='#dev')window.__fl={S,cam,camT,fire,cur,lieAt,begin,startHole,overviewCam,closeSheet,COURSES,ALL,HOLE,courseIds,C,Net,refresh,startRange};
})();
</script>
